<style>

:root{color-scheme:dark;--bg:#151517;--bg-2:#1b1b1e;--ink:#ededed;--muted:#a1a1a1;--dim:#6e6e73;--line:rgba(255,255,255,.12);--chip:rgba(255,255,255,.04);--gutter:clamp(16px,2.6vw,28px);--sans:"Geist",ui-sans-serif,system-ui,sans-serif;--serif:"Newsreader","Times New Roman",serif}

a{color:inherit;text-decoration:none}

:focus-visible{outline:2px solid #fff;outline-offset:3px;border-radius:6px}
.hero{position:relative;min-height:100vh;min-height:100svh;isolation:isolate;overflow:hidden;background:var(--bg)}
.stage{position:absolute;inset:0;z-index:-1;touch-action:pan-y;opacity:0;animation:fade 1.6s .2s ease forwards}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#fx{mix-blend-mode:screen}
.nav{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:14px var(--gutter);height:64px}
.brand{display:flex;align-items:center;gap:14px}
.brand svg{width:22px;height:22px;fill:#fff}
.brand-slash{color:var(--dim);font-size:22px;font-weight:300;transform:translateY(-1px)}
.brand-name{font-family:var(--serif);font-size:24px;font-weight:400;letter-spacing:-.01em;line-height:1}
.links{display:flex;gap:20px;margin-left:12px}
.links a{font-size:14px;color:var(--muted);transition:color .2s}.links a:hover{color:var(--ink)}
.right{display:flex;align-items:center;gap:8px}
.search{display:flex;align-items:center;justify-content:space-between;gap:28px;height:36px;padding:0 6px 0 12px;min-width:172px;border:1px solid var(--line);border-radius:8px;background:var(--chip);font-size:14px;color:var(--muted);transition:border-color .2s,color .2s}
.search:hover{border-color:rgba(255,255,255,.22);color:var(--ink)}

.ask{height:36px;padding:0 12px;border:1px solid var(--line);border-radius:8px;font-size:14px;font-weight:500;background:var(--chip);transition:background .2s,border-color .2s}
.ask:hover{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.22)}
.icon-btn{width:36px;height:36px;display:grid;place-items:center;border-radius:8px;transition:background .2s}
.icon-btn:hover{background:rgba(255,255,255,.06)}
.icon-btn svg{width:18px;height:18px}
.menu{display:none}
.copy{position:relative;z-index:1;min-height:calc(100svh - 64px);display:flex;flex-direction:column;justify-content:center;padding:0 var(--gutter) 64px;max-width:560px;pointer-events:none}
.copy>*{pointer-events:auto}
.wordmark{font-family:var(--serif);font-weight:400;font-size:clamp(72px,8.6vw,124px);line-height:.9;letter-spacing:-.035em;font-variation-settings:"opsz" 72;margin-bottom:clamp(14px,1.8vw,22px)}
.lede{font-size:clamp(28px,3.05vw,44px);line-height:1.2;font-weight:400;letter-spacing:-.025em;margin-bottom:clamp(24px,2.6vw,36px)}
.lede span{display:block}
.tabs{display:flex;align-items:center;gap:8px;font-size:15px;margin-bottom:14px}
.tab{color:var(--dim);padding:2px 0;transition:color .2s}.tab:hover{color:var(--muted)}.tab[aria-selected=true]{color:var(--ink)}
.dot{color:var(--dim);font-size:11px}

.cmd::before{content:"";position:absolute;left:0;right:0;top:0;height:1px;background:linear-gradient(90deg,rgba(255,255,255,.28),rgba(255,255,255,.08) 70%,transparent)}
.cmd-text{transition:opacity .18s,transform .18s}.cmd-text.swap{opacity:0;transform:translateY(3px)}

.copy-btn:hover{color:var(--ink);background:rgba(255,255,255,.06)}

}

</section>

(function () {
  var cmd = document.getElementById('cmd'), tabs = document.querySelectorAll('.tab'), toastEl = document.getElementById('toast'), tt;

/* ---------- 3D glass ---------- */
let renderer = null, scene, quadScene, quadCam, rt, glassMat, prism, fxTex, quadMat, D = 1;

    const p = P[i], a = P[(i + 2) % 3], b = P[(i + 1) % 3];

function buildPrism() {

  const g = new THREE.ExtrudeGeometry(roundedTriangle(S - fil * 2, S * 0.02), { depth: depth - fil * 2, bevelEnabled: true, bevelThickness: fil, bevelSize: fil, bevelSegments: 4, curveSegments: 16 });

  const R = S / Math.sqrt(3);
  glassMat.uniforms.uPlanes.value = [new THREE.Vector4(0.8660254, 0.5, 0, R / 2), new THREE.Vector4(-0.8660254, 0.5, 0, R / 2), new THREE.Vector4(0, -1, 0, R / 2), new THREE.Vector4(0, 0, 1, depth / 2), new THREE.Vector4(0, 0, -1, depth / 2)];

}
function initGL() {
  try { renderer = new THREE.WebGLRenderer({ canvas: glCanvas, antialias: true, alpha: false }); } catch (e) { renderer = null; }
  if (!renderer || !renderer.capabilities.isWebGL2) { renderer = null; return; }
  renderer.autoClear = false; renderer.outputColorSpace = THREE.LinearSRGBColorSpace; renderer.toneMapping = THREE.NoToneMapping;
  fx.style.display = 'none';
  fxTex = new THREE.CanvasTexture(fx); fxTex.colorSpace = THREE.NoColorSpace; fxTex.minFilter = THREE.LinearFilter; fxTex.generateMipmaps = false;
  quadScene = new THREE.Scene(); quadCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
  quadMat = new THREE.ShaderMaterial({ uniforms: { tLight: { value: fxTex }, uBg: { value: new THREE.Color(0x151517) } }, depthTest: false, depthWrite: false,
    vertexShader: 'varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.,1.); }',
    fragmentShader: 'uniform sampler2D tLight; uniform vec3 uBg; varying vec2 vUv; void main(){ vec4 l=texture2D(tLight,vUv); vec3 lc=l.rgb*l.a; vec3 bg=vec3(21./255.,21./255.,23./255.); gl_FragColor=vec4(1.-(1.-bg)*(1.-clamp(lc,0.,1.)),1.); }' });
  quadScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), quadMat));
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(48, 1, 1, 20000);
  glassMat = new THREE.ShaderMaterial({
    uniforms: { tScene: { value: null }, uRes: { value: new THREE.Vector2() }, uViewProj: { value: new THREE.Matrix4() }, uCam: { value: new THREE.Vector3() }, uPlanes: { value: [] }, uAbsScale: { value: 1 }, uIor: { value: 1.645 } },
    transparent: false, side: THREE.FrontSide,
    vertexShader: `varying vec3 vW; varying vec3 vN; void main(){ vec4 w=modelMatrix*vec4(position,1.); vW=w.xyz; vN=normalize(mat3(modelMatrix)*normal); gl_Position=projectionMatrix*viewMatrix*w; }`,
    fragmentShader: `
      uniform sampler2D tScene; uniform vec2 uRes; uniform mat4 uViewProj; uniform vec3 uCam; uniform vec4 uPlanes[5]; uniform float uAbsScale; uniform float uIor;
      varying vec3 vW; varying vec3 vN;
      float panel(vec3 d, vec3 c, vec2 sz, float fe){ c=normalize(c); float f=dot(d,c); if(f<=0.) return 0.; vec3 t1=normalize(cross(c,vec3(0.,1.,0.)+vec3(1e-4))); vec3 t2=cross(t1,c); float u=dot(d,t1)/f, v=dot(d,t2)/f; return smoothstep(sz.x,sz.x-fe,abs(u))*smoothstep(sz.y,sz.y-fe,abs(v)); }
      vec3 env(vec3 d){

        c+=vec3(.76,.88,1.)*20.*panel(d,vec3(.612,.354,.707),vec2(.5,.16),.035);

      vec3 sampleExit(vec3 p, vec3 dir){
        float tm=1e9; for(int i=0;i<5;i++){ vec3 n=uPlanes[i].xyz; float dn=dot(n,dir); if(dn>1e-4){ float t=(uPlanes[i].w-dot(n,p))/dn; if(t>0.&&t<tm) tm=t; } }
        tm=min(tm,4000.); vec3 e=p+dir*tm; vec4 cp=uViewProj*vec4(e,1.); vec2 uv=cp.xy/cp.w*.5+.5; uv=clamp(uv,vec2(.001),vec2(.999));

      void main(){
        vec3 N=normalize(vN), V=normalize(vW-uCam); float facing=clamp(-dot(V,N),0.,1.);

        vec3 refl=env(reflect(V,N));
        vec3 tr; tr.r=sampleExit(vW,refract(V,N,1./(uIor-.02))).r; tr.g=sampleExit(vW,refract(V,N,1./uIor)).g; tr.b=sampleExit(vW,refract(V,N,1./(uIor+.03))).b;
        vec3 c=tr*(1.-F)*.92+refl*F*2.14;

  buildPrism(); sizeGL();
}
function sizeGL() {
  if (!renderer) return;
  renderer.setPixelRatio(dpr); renderer.setSize(W, H, false);
  if (rt) rt.dispose(); rt = new THREE.WebGLRenderTarget(Math.round(W * dpr), Math.round(H * dpr), { type: THREE.HalfFloatType });
  glassMat.uniforms.tScene.value = rt.texture; glassMat.uniforms.uRes.value.set(W, H);
  D = (H / 2) / Math.tan(24 * Math.PI / 180); camera.aspect = W / H; camera.near = D * 0.1; camera.far = D * 10;
  camera.setViewOffset(W, H, W / 2 - cx, H / 2 - cy, W, H); camera.updateProjectionMatrix();

}

/* ---------- interaction ---------- */
let aim = [0.42, 0.45], aimT = [0.42, 0.45], orb = [0, 0], orbT = [0, 0], lastMove = performance.now();
function setPointer(x, y) { const r = stage.getBoundingClientRect(), nx = Math.min(1, Math.max(0, (x - r.left) / r.width)), ny = Math.min(1, Math.max(0, (y - r.top) / r.height)); aimT = [ny, nx]; orbT = mobile ? [0, 0] : [nx * 2 - 1, ny * 2 - 1]; lastMove = performance.now(); }
addEventListener('pointermove', e => { if (e.isPrimary) setPointer(e.clientX, e.clientY); }, { passive: true });
addEventListener('pointerdown', e => setPointer(e.clientX, e.clientY), { passive: true });
addEventListener('touchmove', e => { const t = e.touches[0]; if (t) setPointer(t.clientX, t.clientY); }, { passive: true });
document.addEventListener('mouseleave', () => { orbT = [0, 0]; });

let resizeT = 0;
function relayout() { layout(); sizeGL(); }
addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(relayout, 60); });
layout(); initGL();
if (!renderer) { camera = null; }
if (document.fonts && document.fonts.ready) document.fonts.ready.then(relayout);

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000), t = now / 1000; last = now;
  const auto = !reduce && (mobile || now - lastMove > 6000);
  if (auto) { const a = t / 18 * Math.PI * 2; aimT = [0.5 + Math.sin(a) * 0.34, 0.5 + Math.cos(a) * 0.34]; if (!mobile) orbT = [0, 0]; }
  const kl = 1 - Math.pow(1 - 0.12, dt * 60), kc = 1 - Math.pow(1 - 0.08, dt * 60);
  aim = [aim[0] + (aimT[0] - aim[0]) * kl, aim[1] + (aimT[1] - aim[1]) * kl]; orb = [orb[0] + (orbT[0] - orb[0]) * kc, orb[1] + (orbT[1] - orb[1]) * kc];
  if (renderer) {
    const yaw = orb[0] * 3.5 * Math.PI / 180, pitch = orb[1] * 3.5 * Math.PI / 180;
    camera.position.set(Math.sin(yaw) * Math.cos(pitch) * D, Math.sin(pitch) * D, Math.cos(yaw) * Math.cos(pitch) * D); camera.lookAt(0, 0, 0); camera.updateMatrixWorld();

    fxTex.needsUpdate = true;
    renderer.setRenderTarget(rt); renderer.clear(); renderer.render(quadScene, quadCam);
    renderer.setRenderTarget(null); renderer.clear(); renderer.render(quadScene, quadCam);
    glassMat.uniforms.uViewProj.value.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse); glassMat.uniforms.uCam.value.copy(camera.position);

    fg.save(); fg.setTransform(ldpr, 0, 0, ldpr, 0, 0); fg.strokeStyle = 'rgba(255,255,255,.35)'; fg.lineWidth = 1; fg.beginPath(); tri.forEach((p, i) => i ? fg.lineTo(p[0], p[1]) : fg.moveTo(p[0], p[1])); fg.closePath(); fg.stroke(); fg.restore();

}
requestAnimationFrame(frame);
