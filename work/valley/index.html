<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alpha Visual Valley</title>
<meta name="description" content="Alpha Visual, an AI visual studio. Wander through a night valley of flowers that grows as you move.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Antonio:wght@400&family=Manrope:wght@400;500&family=Noto+Sans+SC:wght@400&display=swap" rel="stylesheet">
<style>
/* Layout: a full-screen night valley of glowing flowers drawn live in WebGL, with a centred headline, caption, arrow button, top nav and a sound toggle above it. Single dark look by design. */
:root{color-scheme:dark;--u:min(calc(100vw/1600),calc(100vh/900));--cream:#f5efe2}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#000}
body{color:var(--cream);font-family:Manrope,"Noto Sans SC",system-ui,sans-serif;-webkit-font-smoothing:antialiased;background:radial-gradient(120% 70% at 50% 38%,#151a33 0%,#070914 45%,#000 80%)}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
#valley{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none}
.moon{position:fixed;left:50%;top:18%;width:60vmax;height:60vmax;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(closest-side,rgba(190,200,255,.16),rgba(150,120,255,.06) 45%,transparent);pointer-events:none}
.rays{position:fixed;inset:-20%;pointer-events:none;opacity:.5;mix-blend-mode:screen;background:repeating-conic-gradient(from 200deg at 50% 0%,rgba(200,210,255,0) 0deg,rgba(200,210,255,.05) 2deg,rgba(200,210,255,0) 5deg,rgba(200,210,255,0) 11deg);-webkit-mask:radial-gradient(70% 60% at 50% 0%,#000,transparent);mask:radial-gradient(70% 60% at 50% 0%,#000,transparent);animation:sway 18s ease-in-out infinite alternate}
@keyframes sway{to{transform:rotate(3deg)}}
.vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,transparent 45%,rgba(0,0,0,.85) 100%);opacity:.55;transition:opacity .4s}
.ui{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:0;transition:opacity 1.6s ease}
.ui.on{opacity:1}
.ui a,.ui button{pointer-events:auto}
header{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;justify-content:space-between;padding:calc(24*var(--u)) calc(44*var(--u)) 0}
.logo{display:flex;align-items:center;gap:calc(10*var(--u));font-size:calc(26*var(--u));font-weight:500;letter-spacing:-.02em}
.logo svg{width:calc(22*var(--u));height:calc(20*var(--u))}
nav{display:flex;align-items:center;gap:calc(44*var(--u));font-size:calc(14.5*var(--u));font-weight:500;letter-spacing:.16em;text-transform:uppercase}
nav a:not(.pill){transition:opacity .2s}nav a:not(.pill):hover{opacity:.6}
.pill{display:inline-flex;align-items:center;height:calc(46*var(--u));padding:0 calc(26*var(--u));border-radius:99px;background:var(--cream);color:#151510;transition:transform .25s}
.pill:hover{transform:translateY(-1px)}
.hero{position:absolute;left:0;right:0;top:50%;transform:translateY(-46%);display:flex;flex-direction:column;align-items:center;text-align:center;text-shadow:0 4px 40px rgba(0,0,0,.55)}
h1{font:400 calc(158*var(--u))/.92 Antonio,"Arial Narrow",sans-serif;letter-spacing:-.012em;white-space:nowrap}
.cap{margin-top:calc(48*var(--u));font-size:calc(20*var(--u));line-height:1.3}
.go{display:grid;place-items:center;margin-top:calc(34*var(--u));width:calc(58*var(--u));height:calc(58*var(--u));border:1.5px solid var(--cream);border-radius:50%;transition:background .3s,color .3s}
.go:hover{background:var(--cream);color:#151510}
.go svg{width:calc(22*var(--u));height:calc(22*var(--u));fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.corner{position:absolute;right:calc(44*var(--u));bottom:calc(44*var(--u));display:flex;align-items:center;gap:calc(18*var(--u));font-size:calc(12.5*var(--u));font-weight:500;letter-spacing:.16em;text-transform:uppercase}
.corner i{width:1px;height:calc(26*var(--u));background:rgba(245,239,226,.45)}
.sound{display:grid;place-items:center;width:calc(28*var(--u));height:calc(28*var(--u))}
.sound svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.sound .w{transition:opacity .3s}.sound[aria-pressed=false] .w{opacity:0}
.sound[aria-pressed=true] .x{opacity:0}
.loader{position:fixed;inset:0;z-index:3;display:grid;place-items:center;background:#000;transition:opacity 1s ease;pointer-events:none}
.loader.gone{opacity:0}
.loader span{width:calc(9*var(--u));height:calc(9*var(--u));min-width:6px;min-height:6px;border-radius:50%;background:var(--cream);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(.4);opacity:.4}}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translate(-50%,10px);z-index:9;max-width:calc(100vw - 32px);padding:10px 16px;border-radius:999px;background:var(--cream);color:#151510;font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s}
.toast.show{opacity:1;transform:translate(-50%,0)}
a:focus-visible,button:focus-visible{outline:2px solid var(--cream);outline-offset:3px}
@media (max-width:820px){
  :root{--u:1px}
  header{padding:18px 18px 0}
  nav a:not(.pill){display:none}
  .pill{height:40px;padding:0 18px;font-size:12px}
  .hero{left:20px;right:20px}
  h1{font-size:clamp(64px,19vw,96px);white-space:normal}
  .cap{font-size:17px}
  .corner{left:20px;right:20px;justify-content:center;bottom:30px;font-size:11px}
}
@media (prefers-reduced-motion:reduce){.loader span,.rays{animation:none}}
</style>
</head>
<body>
<div class="moon" aria-hidden="true"></div>
<canvas id="valley" aria-hidden="true"></canvas>
<div class="rays" aria-hidden="true"></div>
<div class="vig" id="vig" aria-hidden="true"></div>
<div class="ui" id="ui">
  <header>
    <a class="logo" href="/" aria-label="Alpha Visual, all work"><svg viewBox="0 0 24 22" aria-hidden="true"><path d="M12 0 24 22H17L12 12.4 7 22H0z" fill="currentColor"/></svg>Alpha Visual</a>
    <nav aria-label="Main"><a href="/">Work</a><a href="/work/glass/">Packages</a><a href="/work/process/">Process</a><a class="pill" href="#" data-contact>Let’s talk</a></nav>
  </header>
  <section class="hero">
    <h1>Seen, not scrolled.</h1>
    <p class="cap">Product visuals, grown with AI.<br>让你的产品被看见。</p>
    <a class="go" href="/" id="go" aria-label="See our work"><svg viewBox="0 0 24 24"><path d="M4 12h16M14 6l6 6-6 6"/></svg></a>
  </section>
  <div class="corner"><span>Scroll to wander</span><i></i>
    <button class="sound" id="sound" aria-pressed="false" aria-label="Ambient sound"><svg viewBox="0 0 24 24"><path d="M4 9.5v5h3.5L12 18V6L7.5 9.5Z"/><path class="w" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/><path class="x" d="m16 10 4 4m0-4-4 4"/></svg></button>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="loader" id="loader"><span></span></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.150.1/build/three.min.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var toastEl = $('toast'), tt;
  document.querySelectorAll('[data-contact]').forEach(function (b) { b.addEventListener('click', function (e) { e.preventDefault(); toastEl.textContent = '联系方式待补充：WhatsApp · 微信 · Email'; toastEl.classList.add('show'); clearTimeout(tt); tt = setTimeout(function () { toastEl.classList.remove('show'); }, 2400); }); });
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!window.THREE) { $('loader').classList.add('gone'); $('ui').classList.add('on'); return; }

  /* ---------- terrain: a valley that repeats every L units along z, shared by JS and the shader ---------- */
  var L = 240, WZ = Math.PI * 2 / L;
  function hgt(x, z) { return 0.0035 * x * x + 1.6 * Math.sin(3 * WZ * z + 0.07 * x) + 1.1 * Math.sin(5 * WZ * z - 0.11 * x + 1.3) + 0.6 * Math.sin(0.21 * x + 7 * WZ * z); }
  function sway(z) { return 3.2 * Math.sin(2 * WZ * z) + 1.4 * Math.sin(5 * WZ * z + 0.8); }

  var canvas = $('valley');
  var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: false, alpha: true });
  var scene = new THREE.Scene();
  var cam = new THREE.PerspectiveCamera(55, 1, 0.1, 400);

  var FLOWERS = innerWidth < 820 ? 16000 : 30000, LEAVES = innerWidth < 820 ? 6000 : 10000, TOTAL = FLOWERS + LEAVES;
  var pos = new Float32Array(TOTAL * 2), seed = new Float32Array(TOTAL), kind = new Float32Array(TOTAL), col = new Float32Array(TOTAL * 3), size = new Float32Array(TOTAL);
  var palette = ['#ffd7e8', '#ff8fc7', '#c9a2ff', '#8fd4ff', '#fff1c9', '#ffb38a', '#a8ffe0', '#ff6fa8'].map(function (h) { return new THREE.Color(h); });
  var leafCols = ['#2f6b5a', '#3d7f63', '#28546b', '#4b7a4a'].map(function (h) { return new THREE.Color(h); });
  for (var i = 0; i < TOTAL; i++) {
    var leaf = i >= FLOWERS, x = (Math.random() - 0.5) * (leaf ? 140 : 120);
    if (!leaf && Math.random() < 0.35) x = (Math.random() - 0.5) * 36;
    pos[i * 2] = x; pos[i * 2 + 1] = Math.random() * L;
    seed[i] = Math.random(); kind[i] = leaf ? 1 : 0;
    var c = leaf ? leafCols[(Math.random() * leafCols.length) | 0] : palette[(Math.random() * palette.length) | 0];
    col[i * 3] = c.r; col[i * 3 + 1] = c.g; col[i * 3 + 2] = c.b;
    size[i] = leaf ? 0.2 + Math.random() * 0.22 : 0.09 + Math.pow(Math.random(), 2.2) * 0.3;
  }
  var geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(TOTAL * 3), 3));
  geo.setAttribute('aPos', new THREE.BufferAttribute(pos, 2));
  geo.setAttribute('aSeed', new THREE.BufferAttribute(seed, 1));
  geo.setAttribute('aKind', new THREE.BufferAttribute(kind, 1));
  geo.setAttribute('aCol', new THREE.BufferAttribute(col, 3));
  geo.setAttribute('aSize', new THREE.BufferAttribute(size, 1));
  geo.boundingSphere = new THREE.Sphere(new THREE.Vector3(), 1e6);

  var uni = { uCamZ: { value: 0 }, uTime: { value: 0 }, uMouse: { value: new THREE.Vector2(9, 9) }, uAspect: { value: 1 }, uScale: { value: 400 }, uDisperse: { value: 0 }, uPR: { value: 1 } };
  var HGLSL = 'float hgt(float x,float z){float w=' + WZ.toFixed(8) + ';return 0.0035*x*x+1.6*sin(3.*w*z+0.07*x)+1.1*sin(5.*w*z-0.11*x+1.3)+0.6*sin(0.21*x+7.*w*z);}';
  var mat = new THREE.ShaderMaterial({
    uniforms: uni, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    vertexShader: [
      'attribute vec2 aPos; attribute float aSeed; attribute float aKind; attribute vec3 aCol; attribute float aSize;',
      'uniform float uCamZ,uTime,uAspect,uScale,uDisperse,uPR; uniform vec2 uMouse;',
      'varying vec3 vCol; varying float vA,vKind,vSeed,vGlow,vMorph;', HGLSL,
      'void main(){',
      ' float L=' + L.toFixed(1) + ';',
      ' float z=uCamZ+2.-mod(uCamZ+2.-aPos.y,L); float x=aPos.x;',
      ' float dist=uCamZ-z;',
      ' vec3 p=vec3(x,hgt(x,z)+0.05,z);',
      ' float d=uDisperse*(0.6+aSeed);',
      ' p.y+=d*(1.5+aSeed*7.)+sin(uTime*.7+aSeed*40.)*.25*uDisperse; p.x+=(aSeed-.5)*d*9.+sin(uTime*.5+aSeed*20.)*uDisperse*.6;',
      ' p.y+=sin(uTime*1.3+aSeed*30.+x*.3)*.04;',
      ' vec4 mv=modelViewMatrix*vec4(p,1.); vec4 cp=projectionMatrix*mv;',
      ' vec2 ndc=cp.xy/cp.w; vec2 dd=(ndc-uMouse)*vec2(uAspect,1.); float r=length(dd);',
      ' float push=.11*exp(-r*r/.035); ndc+= (r>1e-4? dd/r:vec2(0.))*push/vec2(uAspect,1.);',
      ' cp.xy=ndc*cp.w; gl_Position=cp;',
      ' vGlow=exp(-r*r/.012);',
      ' float bloom= aKind<.5 ? smoothstep(L*.78,L*.12,dist) : smoothstep(L,L*.45,dist);',
      ' bloom=mix(bloom,.55,uDisperse);',
      ' float s=aSize*(.25+.75*bloom)*uScale/max(.5,-mv.z);',
      ' gl_PointSize=min(s*(1.+vGlow*.6),90.*uPR);',
      ' vA=smoothstep(L*.72,L*.22,dist)*smoothstep(.8,4.,dist)*(aKind<.5?.8:.22);',
      ' vCol=aCol; vKind=aKind; vSeed=aSeed; vMorph=uDisperse;',
      '}'].join('\n'),
    fragmentShader: [
      'varying vec3 vCol; varying float vA,vKind,vSeed,vGlow,vMorph;',
      'void main(){',
      ' vec2 uv=gl_PointCoord*2.-1.; float r=length(uv); float a=atan(uv.y,uv.x);',
      ' float m; vec3 c=vCol;',
      ' if(vKind<.5){',
      '  float n=vSeed<.5?5.:6.; float edge=.7+.26*cos(n*a+vSeed*6.28);',
      '  float petal=smoothstep(edge,edge-.3,r)*(.55+.45*smoothstep(.0,.5,r)); float core=smoothstep(.26,.0,r);',
      '  c=mix(c,vec3(1.,.95,.75),core*.8); m=max(petal*.9,exp(-r*r*3.)*.42);',
      ' } else {',
      '  float an=vSeed*6.28; vec2 q=mat2(cos(an),-sin(an),sin(an),cos(an))*uv; m=smoothstep(1.,.75,q.x*q.x/.16+q.y*q.y);',
      ' }',
      ' float dot_=exp(-r*r*6.); m=mix(m,dot_,vMorph); c=mix(c,vec3(1.,.9,.95),vMorph*.4);',
      ' c+=vGlow*.7; float al=m*vA*(1.+vGlow*2.2+vMorph*.8);',
      ' if(al<.003) discard; gl_FragColor=vec4(c*al,al);',
      '}'].join('\n')
  });
  scene.add(new THREE.Points(geo, mat));

  /* dust drifting near the camera */
  var DUST = 1400, dpos = new Float32Array(DUST * 3);
  for (var j = 0; j < DUST; j++) { dpos[j * 3] = (Math.random() - 0.5) * 40; dpos[j * 3 + 1] = Math.random() * 10; dpos[j * 3 + 2] = -Math.random() * 60; }
  var dgeo = new THREE.BufferGeometry(); dgeo.setAttribute('position', new THREE.BufferAttribute(dpos, 3));
  var dmat = new THREE.ShaderMaterial({ uniforms: { uTime: uni.uTime, uScale: uni.uScale, uCam: { value: new THREE.Vector3() } }, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    vertexShader: 'uniform float uTime,uScale; uniform vec3 uCam; varying float vA; void main(){ vec3 p=position; p.x+=sin(uTime*.2+p.z)*1.5; p.y+=mod(uTime*.25+p.x*.1,10.)-5.; vec3 w=uCam+vec3(p.x,p.y-1.,mod(p.z-uCam.z,60.)-60.); vec4 mv=viewMatrix*vec4(w,1.); gl_Position=projectionMatrix*mv; gl_PointSize=.08*uScale/max(.5,-mv.z); vA=smoothstep(60.,10.,-mv.z)*.5; }',
    fragmentShader: 'varying float vA; void main(){ float r=length(gl_PointCoord*2.-1.); float a=exp(-r*r*5.)*vA; gl_FragColor=vec4(vec3(.9,.92,1.)*a,a); }' });
  var dust = new THREE.Points(dgeo, dmat); dust.frustumCulled = false; scene.add(dust);

  function resize() {
    var w = innerWidth, h = innerHeight, pr = Math.min(1.75, window.devicePixelRatio || 1);
    renderer.setPixelRatio(pr); renderer.setSize(w, h, false);
    cam.aspect = w / h; cam.fov = w / h < 0.8 ? 70 : 55; cam.updateProjectionMatrix();
    uni.uAspect.value = w / h; uni.uPR.value = pr;
    uni.uScale.value = h * pr / (2 * Math.tan(cam.fov * Math.PI / 360));
  }
  addEventListener('resize', resize); resize();

  /* ---------- movement: idle drift, wheel and touch through a virtual scroller ---------- */
  var camZ = 0, vel = 0, boost = 0, speedMul = 1, speedTarget = 1, disperseT = 0;
  var mouse = new THREE.Vector2(9, 9), mouseS = new THREE.Vector2(9, 9), tilt = new THREE.Vector2();
  addEventListener('wheel', function (e) { e.preventDefault(); boost += Math.max(-120, Math.min(120, e.deltaY)) * 0.06; }, { passive: false });
  var ty = null;
  addEventListener('touchstart', function (e) { ty = e.touches[0].clientY; }, { passive: true });
  addEventListener('touchmove', function (e) { if (ty == null) return; var y = e.touches[0].clientY; boost += (ty - y) * 0.06 * 20 / 8; ty = y; }, { passive: true });
  addEventListener('pointermove', function (e) { mouse.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight * 2 - 1)); });
  document.addEventListener('pointerleave', function () { mouse.set(9, 9); });

  var go = $('go');
  go.addEventListener('pointerenter', function () { speedTarget = 0; disperseT = 1; audio.muffle(true); });
  go.addEventListener('pointerleave', function () { speedTarget = 1; disperseT = 0; audio.muffle(false); });

  /* ---------- ambient sound made in the browser: a soft chord, a slow swell and wind ---------- */
  var audio = (function () {
    var ctx = null, master, lp, on = false;
    function init() {
      var AC = window.AudioContext || window.webkitAudioContext; if (!AC) return false;
      ctx = new AC(); master = ctx.createGain(); master.gain.value = 0; lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 9000;
      master.connect(lp); lp.connect(ctx.destination);
      [110, 164.81, 220, 246.94, 329.63, 440].forEach(function (f, k) {
        var o = ctx.createOscillator(), g = ctx.createGain(), lfo = ctx.createOscillator(), lg = ctx.createGain();
        o.type = k % 2 ? 'triangle' : 'sine'; o.frequency.value = f * (1 + (k - 2.5) * 0.0015);
        g.gain.value = 0.05 / (1 + k * 0.4); lfo.frequency.value = 0.05 + k * 0.023; lg.gain.value = g.gain.value * 0.8;
        lfo.connect(lg); lg.connect(g.gain); o.connect(g); g.connect(master); o.start(); lfo.start();
      });
      var buf = ctx.createBuffer(1, ctx.sampleRate * 4, ctx.sampleRate), d = buf.getChannelData(0), last = 0;
      for (var n = 0; n < d.length; n++) { last = (last + 0.02 * (Math.random() * 2 - 1)) / 1.02; d[n] = last * 3.5; }
      var src = ctx.createBufferSource(), bp = ctx.createBiquadFilter(), ng = ctx.createGain(); src.buffer = buf; src.loop = true; bp.type = 'bandpass'; bp.frequency.value = 600; bp.Q.value = 0.6; ng.gain.value = 0.35;
      src.connect(bp); bp.connect(ng); ng.connect(master); src.start();
      return true;
    }
    return {
      toggle: function () { if (!ctx && !init()) return false; if (ctx.state === 'suspended') ctx.resume(); on = !on; master.gain.cancelScheduledValues(ctx.currentTime); master.gain.setTargetAtTime(on ? 0.5 : 0, ctx.currentTime, 0.6); return on; },
      muffle: function (m) { if (!ctx) return; lp.frequency.setTargetAtTime(m ? 520 : 9000, ctx.currentTime, 0.35); }
    };
  })();
  var sound = $('sound');
  sound.addEventListener('click', function () { sound.setAttribute('aria-pressed', String(audio.toggle())); });

  /* ---------- frame loop ---------- */
  var start = performance.now(), last = start, introDone = false, vig = $('vig');
  $('loader').classList.add('gone');
  function frame(now) {
    var dt = Math.min(0.05, (now - last) / 1000); last = now;
    var t = (now - start) / 1000; uni.uTime.value = t;
    speedMul += (speedTarget - speedMul) * (1 - Math.exp(-dt * 2.2));
    uni.uDisperse.value += (disperseT - uni.uDisperse.value) * (1 - Math.exp(-dt * 1.8));
    boost *= Math.exp(-dt * 2.4); vel = (reduce ? 0.6 : 1.8) + boost;
    camZ -= vel * speedMul * dt;
    uni.uCamZ.value = camZ;
    var intro = Math.min(1, t / 2.6), ei = 1 - Math.pow(1 - intro, 3);
    if (intro >= 1 && !introDone) { introDone = true; $('ui').classList.add('on'); }
    mouseS.lerp(mouse.x > 5 ? new THREE.Vector2(9, 9) : mouse, 0.2); uni.uMouse.value.copy(mouse.x > 5 ? mouse : mouseS);
    tilt.lerp(mouse.x > 5 ? new THREE.Vector2() : mouse, 0.04);
    var cx = sway(camZ), cy = hgt(cx, camZ) + 1.0 + 1.6 * ei;
    cam.position.set(cx, cy, camZ);
    var lz = camZ - 10, lx = sway(lz);
    cam.lookAt(lx + tilt.x * 1.6, hgt(lx, lz) + 1.9 + tilt.y * 0.9 - (1 - ei) * 1.2, lz);
    dmat.uniforms.uCam.value.copy(cam.position);
    vig.style.opacity = (0.5 + Math.min(0.4, Math.abs(boost) * 0.04)).toFixed(3);
    renderer.render(scene, cam);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
