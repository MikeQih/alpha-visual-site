<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alpha Visual Worlds</title>
<meta name="description" content="One product, any world. A glass controller switches the scene, the light, the colorway or the product, with a transition into each state and a reset back.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: one full-viewport scene drawn in code (a product between pale blue walls), a centred title and line, and a glass controller bar that plays a transition into one state at a time and resets back. Single look by design. */
:root{color-scheme:dark;--retake-ease:cubic-bezier(0.22,1,0.36,1);--retake-slow-ease:cubic-bezier(0.65,0,0.35,1)}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;background:#000;color:#fff}
body{font-family:'Manrope',system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font-family:'Manrope',system-ui,sans-serif;color:inherit}
::selection{background:rgba(255,255,255,0.2)}
:focus-visible{outline:2px solid #fff;outline-offset:3px}
a{color:inherit;text-decoration:none}
.stage{position:relative;isolation:isolate;width:100%;height:100vh;height:100dvh;overflow:hidden;background:#000}
.media{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:0;pointer-events:none}
.hero{position:absolute;inset:0;z-index:10;pointer-events:none}
.hero h1{position:absolute;top:35.9%;left:50%;transform:translateX(-50%);width:min(901px,calc(100vw - 48px));margin:0;text-align:center;font-size:clamp(62px,6.8vw,100px);font-weight:500;line-height:0.8;letter-spacing:-0.04em;white-space:nowrap;text-shadow:0 2px 12px rgb(0 0 0 / 0.14)}
.hero h1 span{display:inline-block;transition:opacity 900ms var(--retake-ease),filter 900ms var(--retake-ease),transform 900ms var(--retake-ease)}
.hero h1 span:nth-child(2){transition-delay:90ms}.hero h1 span:nth-child(3){transition-delay:180ms}
.stage.title-hidden .hero h1 span{opacity:0;filter:blur(12px);transform:translateY(-10px)}
.hero p{position:absolute;top:calc(46.78% + 94px);left:50%;transform:translateX(-50%);width:min(734px,calc(100vw - 48px));margin:0;text-align:center;font-size:clamp(14px,1.25vw,18px);font-weight:400;line-height:1.2;letter-spacing:-0.04em;text-shadow:0 1px 8px rgb(0 0 0 / 0.16)}

.controller{position:absolute;top:46.78%;left:50%;transform:translateX(-50%);width:min(880px,calc(100vw - 48px));height:72px;z-index:20;--glass-x:24%;--glass-y:8%}
.glass{position:absolute;border-radius:999px;pointer-events:none}
.glass::before,.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none}
.glass::before{background:radial-gradient(120% 150% at var(--glass-x,24%) var(--glass-y,8%),rgb(255 255 255 / 0.25),rgb(255 255 255 / 0) 53%),linear-gradient(115deg,rgb(255 255 255 / 0.10),rgb(255 255 255 / 0) 42%)}
.glass::after{padding:1px;background:conic-gradient(from 225deg,#7fe3ff,rgb(255 255 255 / 0.35),#ffffff,#ffd7e6,rgb(255 255 255 / 0.35),#7fe3ff);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.track{top:4px;left:0;width:100%;height:64px;background:rgb(24 55 82 / 0.31);border:1px solid rgb(255 255 255 / 0.2);-webkit-backdrop-filter:blur(9px) saturate(126%) contrast(108%) brightness(103%);backdrop-filter:blur(9px) saturate(126%) contrast(108%) brightness(103%);
  box-shadow:0 14px 38px rgb(4 24 43 / 0.16),0 2px 7px rgb(4 24 43 / 0.1),inset 1px 1px 0 rgb(255 255 255 / 0.48),inset -1px -1px 0 rgb(21 49 73 / 0.14),inset 0 0 0 0.5px rgb(255 255 255 / 0.16);
  transition:left 980ms var(--retake-slow-ease),width 980ms var(--retake-slow-ease),opacity 400ms linear}
.track::after{opacity:0.27}
.capsule{top:-1px;height:72px;left:var(--cap-left,-5px);width:var(--cap-width,calc(20% + 5px));background:rgb(246 251 255 / 0.24);border:1px solid rgb(255 255 255 / 0.28);-webkit-backdrop-filter:blur(13px) saturate(128%) contrast(107%) brightness(105%);backdrop-filter:blur(13px) saturate(128%) contrast(107%) brightness(105%);
  box-shadow:0 11px 28px rgb(4 24 43 / 0.17),0 2px 6px rgb(4 24 43 / 0.1),inset 1px 1px 0 rgb(255 255 255 / 0.62),inset -1px -1px 0 rgb(20 49 73 / 0.18),inset 0 0 12px rgb(255 255 255 / 0.055);
  transition:left 620ms var(--retake-ease),width 620ms var(--retake-ease),background 980ms var(--retake-slow-ease)}
.capsule::after{opacity:0.30}
.controller.collapsed .capsule{left:calc(50% - 100px);width:200px;background:rgb(246 251 255 / 0.14);transition:left 980ms var(--retake-slow-ease),width 980ms var(--retake-slow-ease),background 980ms var(--retake-slow-ease)}
.controller.collapsed .track{left:calc(50% - 96px);width:192px}
.controller.rear-fade .track{opacity:0;transition:left 980ms var(--retake-slow-ease),width 980ms var(--retake-slow-ease),opacity 400ms linear 650ms}
.cells{position:absolute;inset:0;display:grid;grid-template-columns:repeat(5,1fr);align-items:center}
.cell{display:flex;align-items:center;justify-content:center;height:100%;padding:0 14px;text-shadow:0 1px 8px rgb(0 0 0 / 0.22);font-size:23px;font-weight:400;line-height:1.2;letter-spacing:-0.04em;white-space:nowrap;position:relative;
  transition:opacity 420ms var(--retake-ease),filter 420ms var(--retake-ease),transform 980ms var(--retake-slow-ease)}
button.cell{background:transparent;border:0;border-radius:999px;cursor:pointer}
button.cell:disabled{cursor:default}
.lbl{transition:opacity 300ms var(--retake-ease),filter 420ms var(--retake-ease),transform 980ms var(--retake-slow-ease)}
.controller.hl .lbl{opacity:0.5}
.cell.gone{opacity:0;filter:blur(10px);transform:scale(0.94);pointer-events:none}
.controller.restoring .cell{transition:opacity 760ms var(--retake-ease) 60ms,filter 760ms var(--retake-ease) 60ms,transform 980ms var(--retake-slow-ease)}
.cell.chosen{transform:translate(var(--dx,0px),var(--dy,0px))}
.cell .txt{display:inline-block;transition:opacity 420ms var(--retake-ease),filter 420ms var(--retake-ease)}
.cell .txt.out{opacity:0;filter:blur(10px)}
.cell.reset .txt{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px;animation:reveal 520ms var(--retake-ease) both}
@keyframes reveal{from{opacity:0;filter:blur(10px)}to{opacity:1;filter:blur(0)}}

header{position:absolute;top:0;left:0;width:100%;z-index:30;display:grid;grid-template-columns:auto 1fr auto;align-items:center;padding:calc(58px + env(safe-area-inset-top)) 40px 40px;text-shadow:0 1px 6px rgb(0 0 0 / 0.18)}
.brandl{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:600;letter-spacing:-0.03em}
.brandl svg{height:24px;width:auto;display:block}
.meta{display:flex;margin-left:clamp(48px,5vw,70px);gap:clamp(28px,3vw,44px);font-size:18px;line-height:1.2;letter-spacing:-0.04em}
.try{display:inline-flex;align-items:center;justify-content:center;width:152px;height:38px;border-radius:999px;border:1px solid rgb(255 255 255 / 0.75);background:transparent;font-size:18px;letter-spacing:-0.04em;transition:color 300ms,background 300ms,border-color 300ms;position:relative}
.try:hover,.try:focus-visible{background:#fff;color:#0b1a26;border-color:#fff}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.notice{position:absolute;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:40;font-size:13px;letter-spacing:-0.02em;opacity:.8;text-shadow:0 1px 6px rgb(0 0 0 / .25);white-space:nowrap}

@media (max-width:900px){
  header{padding:calc(24px + env(safe-area-inset-top)) 24px 24px}
  .meta{font-size:14px;gap:22px;margin-left:34px}
  .try{width:116px;height:36px;font-size:14px}
  .cell{font-size:clamp(17px,2.5vw,24px)}
}
@media (max-width:700px){
  header{padding-left:18px;padding-right:18px}
  .brandl svg{height:21px}.brandl{font-size:17px}
  .meta{font-size:12px}.meta span:nth-child(2){display:none}
  .try{width:92px;height:34px;font-size:13px}
  .try::after{content:"";position:absolute;inset:-6px -10px}
  .hero h1{top:34%;width:calc(100vw - 40px);font-size:clamp(48px,14vw,64px);line-height:.88;white-space:normal}
  .hero p{top:77%;width:calc(100vw - 44px);font-size:14px}
  .controller{top:53%;width:calc(100vw - 40px);height:156px}
  .track{top:0;height:156px;border-radius:28px}
  .controller.collapsed .track{left:0;width:100%}
  .cells{grid-template-columns:1fr 1fr;grid-template-rows:48px 54px 54px}
  .cell{font-size:17px}
  .cells > .lbl{grid-column:1 / -1;border-bottom:1px solid rgb(255 255 255 / 0.12)}
  .cells > button.cell:nth-of-type(odd){border-right:1px solid rgb(255 255 255 / 0.12)}
  .cells > button.cell:nth-of-type(1),.cells > button.cell:nth-of-type(2){border-bottom:1px solid rgb(255 255 255 / 0.12);border-radius:0}
  button.cell{border-radius:0}
  button.cell:active,button.cell:focus-visible{background:rgb(255 255 255 / 0.08);outline-offset:-3px}
  .capsule{opacity:0;pointer-events:none}
  .controller.collapsed .capsule{opacity:1;left:50%;top:4vh;top:4dvh;transform:translate(-50%,-50%);width:196px;height:64px;border-radius:999px;background:rgb(246 251 255 / 0.18)}
  .cell.chosen{border:0!important}
}
@media (max-width:700px) and (max-height:700px){
  .controller{top:50%}
  .hero p{top:calc(50% + 168px);width:calc(100vw - 32px);font-size:13px}
}
@media (max-height:520px) and (orientation:landscape){
  .hero h1{top:20%;font-size:clamp(34px,8vh,56px)}
  .controller{top:50%}
  .hero p{top:auto;bottom:8px;font-size:13px}
}
@media (max-width:700px) and (max-height:520px) and (orientation:landscape){
  .hero h1{top:12%;font-size:clamp(28px,7vh,44px)}
  .controller{top:46%;height:118px}.track{height:118px}
  .cells{grid-template-rows:36px 41px 41px}.cell{font-size:15px}
  .hero p{bottom:6px;font-size:12px}
}
@media (prefers-reduced-motion:reduce){
  .capsule,.track,.cell,.lbl,.cell .txt,.hero h1 span,.try{transition-duration:1ms!important;transition-delay:0s!important}
  .cell.gone,.cell .txt.out,.stage.title-hidden .hero h1 span{filter:none}
  .cell.reset .txt{animation-duration:1ms}
}
</style>
</head>
<body>
<main class="stage" id="stage">
  <canvas class="media" id="scene" aria-hidden="true"></canvas>
  <div class="hero">
    <h1><span>Set</span> <span>the</span> <span>scene</span></h1>
    <p>Alpha Visual puts one product into any world: a new scene, new light, a new colorway or a whole new line-up, made with AI and finished by hand.</p>
  </div>
  <div class="controller" id="ctl" role="group" aria-label="Scene state controller">
    <div class="glass track"></div>
    <div class="glass capsule"></div>
    <div class="cells">
      <div class="cell lbl">Select state →</div>
      <button type="button" class="cell" data-k="scene" data-i="1"><span class="txt">Scene</span></button>
      <button type="button" class="cell" data-k="light" data-i="2"><span class="txt">Lighting</span></button>
      <button type="button" class="cell" data-k="colorway" data-i="3"><span class="txt">Colorway</span></button>
      <button type="button" class="cell" data-k="fullLook" data-i="4"><span class="txt">Product</span></button>
    </div>
  </div>
  <header>
    <a class="brandl" href="/" aria-label="Alpha Visual, all work"><svg viewBox="0 0 24 22" aria-hidden="true"><path d="M12 0 24 22H17L12 12.4 7 22H0z" fill="#fff"/></svg>Alpha Visual</a>
    <div class="meta"><span>AI visual studio</span><span>Any product, any world</span></div>
    <a class="try" href="/">All work</a>
  </header>
  <div class="sr" id="status" role="status" aria-live="polite"></div>
  <div class="notice">Scenes drawn in code as placeholders for AI film transitions.</div>
</main>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var stage = $('stage'), ctl = $('ctl'), statusEl = $('status');
  var buttons = Array.prototype.slice.call(ctl.querySelectorAll('button.cell'));
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  function say(m) { statusEl.textContent = m; }

  /* ---------- the scene, drawn in a 1920 x 1080 frame and cropped like object-fit: cover ---------- */
  var c = $('scene'), g = c.getContext('2d'), W, H, DPR, S, OX, OY;
  var mix = { scene: 0, light: 0, colorway: 0, fullLook: 0 };
  function lerp(a, b, t) { return a + (b - a) * t; }
  function hex(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
  function col(a, b, t, al) { var x = hex(a), y = hex(b); return 'rgba(' + Math.round(lerp(x[0], y[0], t)) + ',' + Math.round(lerp(x[1], y[1], t)) + ',' + Math.round(lerp(x[2], y[2], t)) + ',' + (al == null ? 1 : al) + ')'; }
  function sm(a, b, t) { t = Math.max(0, Math.min(1, (t - a) / (b - a))); return t * t * (3 - 2 * t); }
  function resize() {
    W = innerWidth; H = stage.clientHeight; DPR = Math.min(2, window.devicePixelRatio || 1);
    c.width = Math.round(W * DPR); c.height = Math.round(H * DPR);
    S = Math.max(W / 1920, H / 1080); if (W / H < 0.8) S *= 0.8; OX = (W - 1920 * S) / 2; OY = W / H < 0.8 ? H - 1080 * S : (H - 1080 * S) / 2; draw();
  }
  function bottle(x, base, h, P, alpha, clipY) {
    var w = h * 0.4, hw = w / 2, top = base - h, sh = top + h * 0.3;
    g.save(); g.globalAlpha = alpha;
    if (clipY != null) { g.beginPath(); g.rect(x - w, clipY, w * 2, base - clipY + 4); g.clip(); }
    var p = new Path2D(); p.moveTo(x - hw * 0.34, top + h * 0.12); p.lineTo(x - hw * 0.34, top + h * 0.2); p.bezierCurveTo(x - hw * 0.34, sh, x - hw, sh - h * 0.04, x - hw, sh + h * 0.08); p.lineTo(x - hw, base - 14); p.quadraticCurveTo(x - hw, base, x - hw + 14, base); p.lineTo(x + hw - 14, base); p.quadraticCurveTo(x + hw, base, x + hw, base - 14); p.lineTo(x + hw, sh + h * 0.08); p.bezierCurveTo(x + hw, sh - h * 0.04, x + hw * 0.34, sh, x + hw * 0.34, top + h * 0.2); p.lineTo(x + hw * 0.34, top + h * 0.12); p.closePath();
    var gl = g.createLinearGradient(x - hw, 0, x + hw, 0); P.glass.forEach(function (s, i) { gl.addColorStop(i / (P.glass.length - 1), s); });
    g.fillStyle = gl; g.fill(p);
    g.save(); g.clip(p);
    var lv = g.createLinearGradient(0, sh, 0, base); lv.addColorStop(0, 'rgba(255,255,255,0)'); lv.addColorStop(1, P.deep); g.fillStyle = lv; g.fillRect(x - hw, sh, w, base - sh);
    g.fillStyle = 'rgba(255,255,255,.7)'; g.fillRect(x - hw * 0.7, sh + 10, w * 0.05, base - sh - 30);
    g.fillStyle = 'rgba(255,255,255,.22)'; g.fillRect(x - hw * 0.55, sh + 10, w * 0.12, base - sh - 30);
    g.fillStyle = 'rgba(255,255,255,.45)'; g.fillRect(x + hw * 0.78, sh + 20, w * 0.025, base - sh - 50);
    var ly = base - h * 0.42, lh = h * 0.2; g.fillStyle = P.label; g.fillRect(x - hw * 0.72, ly, w * 0.72, lh);
    g.fillStyle = P.ink; g.textAlign = 'center'; g.font = '600 ' + Math.round(h * 0.05) + 'px Manrope, sans-serif'; g.fillText('ALPHA', x, ly + lh * 0.45);
    g.font = '400 ' + Math.round(h * 0.026) + 'px Manrope, sans-serif'; g.fillText(P.line, x, ly + lh * 0.75);
    g.restore();
    var cap = g.createLinearGradient(x - hw * 0.46, 0, x + hw * 0.46, 0); P.cap.forEach(function (s, i) { cap.addColorStop(i / (P.cap.length - 1), s); });
    g.fillStyle = cap; g.beginPath(); g.roundRect ? g.roundRect(x - hw * 0.46, top - h * 0.02, hw * 0.92, h * 0.15, 8) : g.rect(x - hw * 0.46, top - h * 0.02, hw * 0.92, h * 0.15); g.fill();
    g.restore();
  }
  var PA = { glass: ['#5f93ad', '#cfeaf4', '#f4fbfd', '#a9d3e3', '#4f7f99'], deep: 'rgba(60,120,150,.35)', label: '#f7fbfd', ink: '#1c3a4c', line: 'EAU FRAÎCHE', cap: ['#8e9aa3', '#f2f5f7', '#7d8992'] };
  var PB = { glass: ['#0c1f5a', '#3557c9', '#7d9cff', '#2a46b0', '#081644'], deep: 'rgba(5,10,40,.45)', label: '#e7c56f', ink: '#12204a', line: 'NUIT COBALT', cap: ['#8a6424', '#f6dc95', '#6e4f19'] };
  var parts = []; for (var i = 0; i < 90; i++) parts.push([Math.random() * 2 - 1, Math.random(), Math.random() * 6.28, 2 + Math.random() * 5]);
  function draw() {
    var sc = sm(0, 1, mix.scene), li = sm(0, 1, mix.light), cw = mix.colorway, fl = mix.fullLook;
    g.setTransform(DPR * S, 0, 0, DPR * S, DPR * OX, DPR * OY);
    /* outside: a pale sky, opening into a coast for Scene, warming for Lighting */
    var sky = g.createLinearGradient(0, 0, 0, 860);
    sky.addColorStop(0, col(col2(li, '#5d8fbd', '#d98b6a'), '#2f7fc2', sc)); sky.addColorStop(1, col(col2(li, '#a9cbe6', '#ffd2a6'), '#bfe6f7', sc));
    g.fillStyle = sky; g.fillRect(-400, -1400, 2720, 2400);
    if (sc > 0.01) {
      g.globalAlpha = sc; g.fillStyle = '#2b78a8'; g.fillRect(-400, 640, 2720, 120);
      var shine = g.createLinearGradient(0, 640, 0, 760); shine.addColorStop(0, 'rgba(255,255,255,.35)'); shine.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = shine; g.fillRect(-400, 640, 2720, 120);
      g.fillStyle = 'rgba(255,255,255,.55)'; for (var k = 0; k < 40; k++) g.fillRect(((k * 173) % 2400) - 300, 660 + (k * 37 % 90), 60 + (k * 13 % 90), 2);
      g.fillStyle = 'rgba(255,250,235,.95)'; g.beginPath(); g.arc(1500, 300, 70, 0, 7); g.fill();
      g.globalAlpha = 1;
    }
    /* room: back wall with an arch, side walls and floor; Scene slides it all away */
    var ow = lerp(560, 2600, sc), oh = lerp(640, 1300, sc), archTop = 860 - oh;
    var wall = col(col2(li, '#7fa3c4', '#e5a982'), '#7fa3c4', 0), side = col2(li, '#6c92b5', '#cf9270'), floor = col(col2(li, '#93b3cf', '#f0c39f'), '#efe0c2', sc);
    g.save(); g.globalAlpha = 1 - sm(0.55, 1, sc) * 0.95;
    g.beginPath(); g.rect(-400, -1400, 2720, 2260); g.moveTo(960 - ow / 2, 860); g.lineTo(960 - ow / 2, archTop + ow / 2); g.arc(960, archTop + ow / 2, ow / 2, Math.PI, 0); g.lineTo(960 + ow / 2, 860); g.closePath();
    g.fillStyle = wall; g.fill('evenodd');
    var push = sc * 700;
    g.fillStyle = side; g.beginPath(); g.moveTo(-400 - push, -1400); g.lineTo(340 - push, -1400); g.lineTo(340 - push, 110); g.lineTo(340 - push, 860); g.lineTo(-400 - push, 1180); g.fill();
    g.beginPath(); g.moveTo(2320 + push, -1400); g.lineTo(1580 + push, -1400); g.lineTo(1580 + push, 110); g.lineTo(1580 + push, 860); g.lineTo(2320 + push, 1180); g.fill();
    g.restore();
    g.fillStyle = floor; g.beginPath(); g.moveTo(-400, 860); g.lineTo(2320, 860); g.lineTo(2320, 1300); g.lineTo(-400, 1300); g.fill();
    var fg = g.createLinearGradient(0, 860, 0, 1080); fg.addColorStop(0, 'rgba(255,255,255,.18)'); fg.addColorStop(1, 'rgba(0,20,40,.12)'); g.fillStyle = fg; g.fillRect(-400, 860, 2720, 440);
    /* Lighting: warm window beams sweep in and the shadow stretches */
    if (li > 0.01) {
      g.save(); g.globalCompositeOperation = 'lighter';
      for (var b = 0; b < 3; b++) { var bx = lerp(-900, 0, li) + b * 260; g.fillStyle = 'rgba(255,200,140,' + (0.16 * li) + ')'; g.beginPath(); g.moveTo(bx + 200, -100); g.lineTo(bx + 340, -100); g.lineTo(bx + 1240, 1100); g.lineTo(bx + 980, 1100); g.fill(); }
      g.restore();
    }
    g.fillStyle = 'rgba(20,40,60,' + (0.22 + li * 0.1) + ')'; g.beginPath(); g.ellipse(960 + li * 170, 958, 240 + li * 220, 26, 0, 0, 7); g.fill();
    /* plinth */
    var pt = g.createLinearGradient(750, 0, 1170, 0); pt.addColorStop(0, col2(li, '#c9dbea', '#f2cfb3')); pt.addColorStop(0.5, col2(li, '#f2f7fb', '#fff1e4')); pt.addColorStop(1, col2(li, '#b4cbdf', '#dfb294'));
    g.fillStyle = pt; g.fillRect(750, 940, 420, 80); g.beginPath(); g.ellipse(960, 1020, 210, 30, 0, 0, Math.PI); g.fill();
    g.fillStyle = col2(li, '#f6fafd', '#fff6ee'); g.beginPath(); g.ellipse(960, 940, 210, 30, 0, 0, 7); g.fill();
    /* product: colorway sweeps up the bottle; product swap lifts it away and raises a new set */
    var ax = 1 - sm(0, 0.55, fl), ay = -fl * 80;
    if (ax > 0.01) {
      bottle(960, 940 + ay, 480, PA, ax);

  addEventListener('resize', resize); resize();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(draw);
  say('Base scene. Choose a state.');
