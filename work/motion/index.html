<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alpha Visual Motion</title>
<meta name="description" content="Alpha Visual makes products move: AI product films and launch visuals for brands in Singapore.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500&family=Noto+Sans+SC:wght@400&display=swap">
<style>
/* Layout: one full-screen night scene drawn live on a canvas (a slot for a real product film later), with three oversized lowercase words and three facts placed around it. Single dark look by design. */
:root{
  color-scheme: dark;
  --bg:#05070a;
  --text:#f5f7fa;
  --mute:rgba(245,247,250,.62);
  --pill:rgba(20,22,26,.72);
  --sans:"Outfit","Noto Sans SC",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg)}
body{color:var(--text);font-family:var(--sans);font-weight:400;-webkit-font-smoothing:antialiased}
button,a{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-decoration:none}
#scene,#film{position:fixed;inset:0;width:100%;height:100%;display:block;object-fit:cover}
#film{display:none}
.top{position:fixed;left:0;right:0;top:0;z-index:3;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:calc(20px + env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-right,0px)) 0 max(24px,env(safe-area-inset-left,0px))}
.brand{justify-self:start;display:flex;align-items:center;gap:8px;height:42px;padding:0 14px;border-radius:12px;background:var(--pill);font-size:14px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.links{display:flex;gap:4px;height:42px;padding:4px;border-radius:12px;background:var(--pill);font-size:14px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.links a{display:grid;place-items:center;padding:0 16px;border-radius:9px;color:var(--mute);transition:color .2s,background .2s}
.links a:hover{color:var(--text);background:rgba(255,255,255,.08)}
.book{justify-self:end;height:42px;padding:0 18px;border-radius:12px;background:var(--text);color:#05070a;font-size:14px;font-weight:500}

.w{position:fixed;z-index:2;font-weight:500;font-size:clamp(76px,13vw,230px);line-height:.86;letter-spacing:-.05em;text-shadow:0 10px 60px rgba(0,0,0,.35);pointer-events:none}
.w1{left:max(16px,1.5vw);top:16vh}
.w2{right:max(16px,2vw);top:38vh}
.w3{left:28vw;top:60vh}
.lede{position:fixed;z-index:2;left:max(24px,2.4vw);top:calc(16vh + clamp(76px,13vw,230px) * .95);max-width:300px;font-size:14px;line-height:1.5;color:rgba(245,247,250,.82)}
.stat{position:fixed;z-index:2;display:flex;flex-direction:column;gap:2px}
.stat b{font-weight:400;font-size:clamp(28px,3vw,46px);letter-spacing:-.03em;line-height:1}
.stat span{font-size:12.5px;color:var(--mute)}
.s1{right:max(28px,6vw);top:13vh;text-align:left}
.s1::before{content:"";position:absolute;right:calc(100% + 18px);top:16px;width:110px;height:1px;background:rgba(245,247,250,.5);transform:rotate(18deg);transform-origin:right}
.s2{left:max(28px,4vw);bottom:calc(6vh + env(safe-area-inset-bottom,0px))}
.s3{right:max(28px,4vw);bottom:calc(6vh + env(safe-area-inset-bottom,0px));text-align:right}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,10px);z-index:9;max-width:calc(100vw - 32px);padding:10px 16px;border-radius:999px;background:var(--text);color:#05070a;font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s}
.toast.show{opacity:1;transform:translate(-50%,0)}
button:focus-visible,a:focus-visible{outline:2px solid var(--text);outline-offset:3px}
@media (max-width:760px){
  .links{display:none}
  .top{grid-template-columns:1fr 1fr}
  .w1{top:14vh}.w2{top:34vh}.w3{left:6vw;top:52vh}
  .lede{top:auto;bottom:calc(16vh + env(safe-area-inset-bottom,0px));max-width:calc(100vw - 48px)}
  .s1{display:none}
}
</style>
</head>
<body>
<canvas id="scene" aria-hidden="true"></canvas>
<!-- To use a real product film, set src on this video; the canvas scene then hides. -->
<video id="film" muted loop playsinline autoplay preload="metadata" aria-hidden="true"></video>

<header class="top">
  <a class="brand" href="/" aria-label="Alpha Visual, all work"><svg width="16" height="15" viewBox="0 0 24 22" aria-hidden="true"><path d="M12 0 24 22H17L12 12.4 7 22H0z" fill="currentColor"/></svg>alpha visual</a>
  <nav class="links" aria-label="Main"><a href="/">work</a><a href="/work/glass/">packages</a><a href="/work/process/">process</a><a href="#" data-contact>contact</a></nav>
  <button type="button" class="book" data-contact>book a call</button>
</header>

<h1 class="sr" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Make products move</h1>
<div class="w w1" aria-hidden="true">make</div>
<div class="w w2" aria-hidden="true">products</div>
<div class="w w3" aria-hidden="true">move</div>
<p class="lede">AI product films and launch visuals for brands in Singapore. 产品宣传片，3 天起交付。</p>

<div class="stat s1"><b>5</b><span>service packages</span></div>
<div class="stat s2"><b>3–7</b><span>days to deliver</span></div>
<div class="stat s3"><b>EN · 中文</b><span>bilingual by default</span></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  var toastEl = document.getElementById('toast'), tt;
  document.querySelectorAll('[data-contact]').forEach(function (b) { b.addEventListener('click', function (e) { e.preventDefault(); toastEl.textContent = '联系方式待补充：WhatsApp · 微信 · Email'; toastEl.classList.add('show'); clearTimeout(tt); tt = setTimeout(function () { toastEl.classList.remove('show'); }, 2400); }); });

  var film = document.getElementById('film');
  if (film.getAttribute('src')) { film.style.display = 'block'; document.getElementById('scene').style.display = 'none'; return; }

  /* placeholder film: a night slope, a spray of powder lit from one side, snow drifting through */
  var c = document.getElementById('scene'), g = c.getContext('2d');
  var W, H, DPR, flakes = [], spray = [];
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  function rnd(a, b) { return a + Math.random() * (b - a); }
  function resize() {
    W = innerWidth; H = innerHeight; DPR = Math.min(2, window.devicePixelRatio || 1);
    c.width = Math.round(W * DPR); c.height = Math.round(H * DPR);
    flakes = []; for (var i = 0; i < Math.round(W * H / 2600); i++) flakes.push({ x: rnd(0, W), y: rnd(0, H), r: rnd(0.4, 2.2), v: rnd(10, 40), d: rnd(-12, 4) });
  }
  function emit(n) {
    var ex = W * 0.47, ey = H * 0.78;
    for (var i = 0; i < n; i++) { var a = rnd(-2.75, -1.75), s = rnd(140, 520); spray.push({ x: ex + rnd(-30, 30), y: ey + rnd(-8, 8), vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0, max: rnd(0.8, 2.2), r: rnd(0.6, 3.2) }); }
  }
  function slope() {
    g.beginPath(); g.moveTo(0, H * 0.82);
    g.bezierCurveTo(W * 0.3, H * 0.74, W * 0.6, H * 0.8, W, H * 0.7);
    g.lineTo(W, H); g.lineTo(0, H); g.closePath();
  }
  var last = performance.now(), acc = 0;
  function frame(now) {
    var dt = Math.min(0.05, (now - last) / 1000); last = now;
    g.setTransform(DPR, 0, 0, DPR, 0, 0);
    var sky = g.createLinearGradient(0, 0, 0, H); sky.addColorStop(0, '#05070a'); sky.addColorStop(1, '#10141b'); g.fillStyle = sky; g.fillRect(0, 0, W, H);
    var spot = g.createRadialGradient(W * 0.5, H * 0.66, 10, W * 0.5, H * 0.66, Math.max(W, H) * 0.55);
    spot.addColorStop(0, 'rgba(210,225,255,.28)'); spot.addColorStop(1, 'rgba(210,225,255,0)'); g.fillStyle = spot; g.fillRect(0, 0, W, H);
    slope(); var sg = g.createLinearGradient(0, H * 0.7, 0, H); sg.addColorStop(0, '#d9e1ea'); sg.addColorStop(1, '#7b8592'); g.fillStyle = sg; g.fill();
    if (!reduce) { acc += dt; while (acc > 0.016) { emit(9); acc -= 0.016; } }
    g.globalCompositeOperation = 'lighter';
    for (var i = spray.length - 1; i >= 0; i--) {
      var p = spray[i]; p.life += dt; if (p.life > p.max) { spray.splice(i, 1); continue; }
      p.vy += 260 * dt; p.vx *= 0.985; p.vy *= 0.985; p.x += p.vx * dt; p.y += p.vy * dt;
      var a = 1 - p.life / p.max; g.fillStyle = 'rgba(235,242,255,' + (a * 0.55).toFixed(3) + ')';
      g.beginPath(); g.arc(p.x, p.y, p.r * (1 + p.life * 1.4), 0, Math.PI * 2); g.fill();
    }
    g.globalCompositeOperation = 'source-over';
    g.fillStyle = 'rgba(255,255,255,.75)';
    for (var j = 0; j < flakes.length; j++) {
      var f = flakes[j]; if (!reduce) { f.y += f.v * dt; f.x += f.d * dt; }
      if (f.y > H) { f.y = -4; f.x = rnd(0, W); } if (f.x < -4) f.x = W + 4;
      g.beginPath(); g.arc(f.x, f.y, f.r, 0, Math.PI * 2); g.fill();
    }
    var vig = g.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.3, W / 2, H / 2, Math.max(W, H) * 0.75);
    vig.addColorStop(0, 'rgba(0,0,0,0)'); vig.addColorStop(1, 'rgba(0,0,0,.6)'); g.fillStyle = vig; g.fillRect(0, 0, W, H);
    requestAnimationFrame(frame);
  }
  resize(); addEventListener('resize', resize);
  if (reduce) emit(900);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
