<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alpha Visual Lookbook</title>
<meta name="description" content="A product lookbook where six products stand in a line into the distance and every drag brings the next one to the front.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Michroma&family=Noto+Sans+SC:wght@400&display=swap" rel="stylesheet">
<style>
/* Layout: header, then a stage where six drawn products recede in a line, and a product rail on the right that scrolls in sync. Single light look by design. */
:root{color-scheme:light;--u:min(calc(100vw/1600),calc(100vh/900));--ink:#16191f;--mid:#737b86;--dim:#a4adb8;--line:#e6ebf0;--ice:#e9f0f7}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#fff}
body{font-family:Inter,"Noto Sans SC",system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;overflow:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.wide{font-family:Michroma,"Noto Sans SC",sans-serif;text-transform:uppercase}
.page{height:100svh;min-height:520px;display:grid;grid-template-rows:auto 1fr;background:#fff}
header{position:relative;z-index:5;background:#fff;padding:calc(20*var(--u)) calc(46*var(--u)) calc(15*var(--u))}
.r1{display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.brand{justify-self:start;display:flex;align-items:center;gap:calc(10*var(--u));font-size:calc(15.5*var(--u));letter-spacing:.2em}
.brand svg{width:calc(16*var(--u));height:calc(15*var(--u))}
.tabs{display:flex;gap:calc(48*var(--u));font-size:calc(14.5*var(--u));letter-spacing:.14em;color:var(--dim)}
.tabs a{transition:color .25s}
.tabs a:hover,.tabs .on{color:var(--ink)}
.acct{justify-self:end;display:flex;align-items:center;gap:calc(22*var(--u));font-size:calc(9.5*var(--u));letter-spacing:.12em}
.acct svg{width:calc(17*var(--u));height:calc(17*var(--u));fill:none;stroke:currentColor;stroke-width:1.5}
.r2{display:flex;justify-content:center;gap:calc(60*var(--u));margin-top:calc(17*var(--u));font-size:calc(9.5*var(--u));letter-spacing:.14em}
.r2 a{transition:color .2s}.r2 a:hover{color:var(--mid)}
main{position:relative;display:grid;grid-template-columns:1fr calc(372*var(--u));min-height:0}
.stage{position:relative;overflow:hidden;min-width:0;touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:none;outline:none;
  background:linear-gradient(transparent 60%,rgba(255,255,255,.72) 100%),linear-gradient(90deg,#f1f5fa 0%,#e7eff6 38%,#eef4f9 62%,#f6f9fc 100%)}
.line{position:absolute;inset:0}
.m{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform,filter;cursor:none}
.m svg{display:block;position:relative;width:100%;height:100%}
.m:before{content:"";position:absolute;left:4%;right:4%;bottom:-1.6%;height:3.6%;border-radius:50%;background:radial-gradient(closest-side,rgba(70,85,105,.3),transparent)}
.intro{position:absolute;z-index:2;left:calc(46*var(--u));top:calc(36*var(--u));width:calc(390*var(--u));pointer-events:none}
.intro h2{font-weight:400;font-size:calc(22*var(--u));line-height:1.2;letter-spacing:.16em;white-space:nowrap}
.intro p{margin-top:calc(16*var(--u));font-size:calc(14*var(--u));line-height:1.62;letter-spacing:.012em;color:var(--mid)}
.tag{position:absolute;z-index:2;left:calc(46*var(--u));bottom:calc(44*var(--u))}
.look{display:flex;font-size:calc(29*var(--u));line-height:calc(38*var(--u));letter-spacing:.14em;gap:.5em;pointer-events:none}
.win{height:calc(38*var(--u));overflow:hidden}
.roll{display:block;will-change:transform}
.roll b{display:block;font-weight:400;height:calc(38*var(--u))}
.pname{margin-top:calc(8*var(--u));font-size:calc(9.5*var(--u));letter-spacing:.14em;color:var(--mid);min-height:1.2em}
.shop{display:inline-block;margin-top:calc(13*var(--u));font-size:calc(9.5*var(--u));letter-spacing:.14em;padding-bottom:calc(4*var(--u));border-bottom:1px solid currentColor}
.ring{position:absolute;z-index:4;left:0;top:0;width:calc(46*var(--u));height:calc(46*var(--u));margin:calc(-23*var(--u)) 0 0 calc(-23*var(--u));border:calc(2.5*var(--u)) solid #16191f;border-radius:99px;pointer-events:none;opacity:0;transition:width .22s cubic-bezier(.2,.8,.2,1),height .22s cubic-bezier(.2,.8,.2,1),margin .22s cubic-bezier(.2,.8,.2,1),opacity .2s}
.ring.show{opacity:1}
.ring.drag{width:calc(84*var(--u));height:calc(34*var(--u));margin:calc(-17*var(--u)) 0 0 calc(-42*var(--u))}
.rail{position:relative;overflow:hidden;background:#f3f6fa;min-height:0}
.card{position:absolute;left:0;top:0;width:100%;display:flex;flex-direction:column;padding:calc(18*var(--u)) calc(24*var(--u)) calc(18*var(--u));will-change:transform;background:#f3f6fa}
.card.alt{background:#fff}
.fav{position:absolute;left:calc(22*var(--u));top:calc(18*var(--u));width:calc(22*var(--u));height:calc(22*var(--u));z-index:1;color:var(--ink)}
.fav svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.4;transition:fill .2s}
.fav[aria-pressed=true] svg{fill:#d8a7a0;stroke:#b98179}
.shot{flex:1;min-height:0;display:block}
.shot svg{display:block;width:100%;height:100%}
.meta{display:grid;grid-template-columns:1fr auto;align-items:end;margin-top:calc(8*var(--u))}
.meta h3{font-weight:400;font-size:calc(9.5*var(--u));letter-spacing:.14em}
.meta span{display:block;grid-column:1;margin-top:calc(6*var(--u));font-size:calc(12.5*var(--u));color:var(--mid);letter-spacing:.03em}
.add{grid-column:2;grid-row:1/3;width:calc(26*var(--u));height:calc(26*var(--u));position:relative;transition:transform .2s}
.add:before,.add:after{content:"";position:absolute;left:50%;top:50%;width:calc(15*var(--u));height:1.5px;margin:-.75px 0 0 calc(-7.5*var(--u));background:var(--ink)}
.add:after{transform:rotate(90deg)}
.add:hover{transform:rotate(90deg)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,10px);z-index:9;max-width:calc(100vw - 32px);padding:10px 16px;border-radius:999px;background:var(--ink);color:#fff;font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s}
.toast.show{opacity:1;transform:translate(-50%,0)}
.wait{position:fixed;inset:0;z-index:9;background:#f1f5fa;transition:opacity .5s;pointer-events:none}
.wait.gone{opacity:0}
button:focus-visible,a:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
@media (max-width:820px){
  :root{--u:1px}
  header{padding:14px 16px 12px}
  .r1{grid-template-columns:1fr auto}
  .tabs,.r2,.acct>a:not(:last-child){display:none}
  .brand{font-size:14px}
  main{grid-template-columns:1fr;grid-template-rows:1fr 190px}
  .stage{cursor:auto}.m{cursor:auto}.ring{display:none}
  .intro{left:16px;top:18px;width:calc(100% - 32px)}
  .intro h2{font-size:17px}
  .intro p{display:none}
  .tag{left:16px;bottom:18px}
  .look{font-size:22px;line-height:30px}.win,.roll b{height:30px}
  .card{width:160px;height:100%;padding:12px}
  .fav{left:10px;top:10px}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs id="defs"></defs></svg>
<div class="page">
  <header>
    <div class="r1">
      <a class="brand wide" href="/" aria-label="Alpha Visual, all work"><svg viewBox="0 0 24 22" aria-hidden="true"><path d="M12 0 24 22H17L12 12.4 7 22H0z" fill="currentColor"/></svg>Alpha Visual</a>
      <nav class="tabs wide" aria-label="Sections"><a class="on" href="#" aria-current="page">Lookbook</a><a href="/">Work</a><a href="/work/glass/">Packages</a><a href="/work/process/">Process</a></nav>
      <div class="acct wide">
        <a href="/">All work</a>
        <a href="#" data-contact aria-label="Search"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg></a>
        <a href="#" data-contact aria-label="Saved"><svg viewBox="0 0 24 24"><path d="M12 20S3.5 15 3.5 9A4.6 4.6 0 0 1 12 6.6 4.6 4.6 0 0 1 20.5 9C20.5 15 12 20 12 20Z"/></svg></a>
        <a href="#" data-contact aria-label="Brief"><svg viewBox="0 0 24 24"><path d="M5 8h14l1 13H4Z"/><path d="M9 10V6a3 3 0 0 1 6 0v4"/></svg></a>
        <a href="#" data-contact>Brief (<span id="cart">0</span>)</a>
      </div>
    </div>
    <nav class="r2 wide" aria-label="Categories"><a href="#">Spirits</a><a href="#">Wine</a><a href="#">Beauty</a><a href="#">Fragrance</a><a href="#">Tea &amp; Food</a><a href="#">Packaging</a></nav>
  </header>
  <main>
    <section class="stage" id="stage" aria-label="Product looks. Drag, scroll or use the arrow keys to change look." tabindex="0">
      <div class="line" id="line"></div>
      <div class="intro">
        <h2 class="wide">Product Lookbook 2026</h2>
        <p>Six products, each lit and styled by Alpha Visual. Drag, scroll or use the arrow keys to bring the next one forward. 拖动或滚动，查看下一款产品。</p>
      </div>
      <div class="tag">
        <div class="look wide" aria-live="polite"><span>Look</span><span class="win"><span class="roll" id="roll"></span></span></div>
        <div class="pname wide" id="pname"></div>
        <a class="shop wide" href="#" data-contact>Book this look</a>
      </div>
      <div class="ring" id="ring"></div>
    </section>
    <aside class="rail" id="rail" aria-label="Deliverables for this look"></aside>
  </main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="wait" id="wait"></div>
<script>
/* ---------- products, drawn as SVG symbols (placeholders for real product shots) ---------- */
const H0=448;
const PRODUCTS=[
  {name:'Highland Ember',kind:'Single malt',w:170,glass:['#3a1606','#9a4a16','#e3a052','#7a3410','#2a0e04'],
   prof:[[66,21],[150,22],[172,40],[192,64],[210,76],[438,76],[448,68]],
   cap:{y0:14,y1:70,hw:27,c:['#4a2a14','#b07a48','#2a170a'],ring:'#d9b46c'},
   label:{y0:282,y1:392,bg:'#efe2c6',ink:'#2a1209',acc:'#9a5520',t1:'HIGHLAND',t2:'Ember',t3:'12 YEARS'}},
  {name:'Harbour Rosé',kind:'Wine',w:150,glass:['#7a3b42','#e8a6a6','#fbd9d2','#d48f92','#6a2d36'],
   prof:[[110,16],[150,17],[190,30],[236,56],[270,65],[438,65],[448,58]],
   cap:{y0:18,y1:112,hw:18,c:['#a86f62','#f2c6b4','#8a5246'],ring:'#e9cdbf'},
   label:{y0:318,y1:398,bg:'#fbf4ee',ink:'#5a2e32',acc:'#c98b86',t1:'HARBOUR',t2:'Rosé',t3:'2025'}},
  {name:'Sage Serum',kind:'Skincare',w:150,glass:['#5c6b58','#aebfa6','#dfe8d8','#9cae94','#4e5c4a'],
   prof:[[176,30],[186,60],[202,70],[438,70],[448,64]],
   cap:{y0:12,y1:176,hw:34,c:['#1d1f22','#5a5e64','#101214'],ring:'#c9a86a',dropper:true},
   label:{y0:270,y1:350,bg:'#f4f1ea',ink:'#2f3a2c',acc:'#7a8b70',t1:'SAGE',t2:'Serum',t3:'30 ML'}},
  {name:'Nº 4 Eau de Parfum',kind:'Fragrance',w:170,glass:['#5f7e98','#b9d2e6','#eef6fc','#a2bfd6','#4e6b84'],
   prof:[[176,22],[188,74],[200,80],[438,80],[448,74]],
   cap:{y0:12,y1:150,hw:46,c:['#8a6a2e','#f1d79a','#6e521f'],ring:'#e8cf8f',neck:{y0:150,y1:178,hw:20}},
   label:{y0:284,y1:356,bg:'#fdfaf2',ink:'#2a3440',acc:'#b8983f',t1:'Nº 4',t2:'',t3:'PARFUM'}},
  {name:'Oolong Reserve',kind:'Tea',w:180,glass:['#b9ad97','#f2ebdc','#fffaf0','#e6dcc8','#a89c86'],
   prof:[[112,78],[438,78],[448,76]],
   cap:{y0:44,y1:112,hw:82,c:['#b9ad97','#fbf6ea','#a29680'],ring:'#c9a45a'},
   label:{y0:176,y1:384,bg:'#b8322a',ink:'#fbf1e0',acc:'#e9c27a',t1:'OOLONG',t2:'乌龙',t3:'RESERVE'}},
  {name:'Juniper 31',kind:'Gin',w:170,glass:['#8fa3a8','#dfe9ea','#f8fcfc','#c9d8da','#7d9196'],
   prof:[[80,22],[132,22],[160,52],[182,76],[196,79],[438,79],[448,74]],
   cap:{y0:18,y1:82,hw:30,c:['#6e3c1e','#d9925a','#5a2e14'],ring:'#e3b07a'},
   label:{y0:262,y1:380,bg:'#f6f1e4',ink:'#24403a',acc:'#3f7a68',t1:'JUNIPER',t2:'31',t3:'DRY GIN'}}
];
function smooth(pts){ // Catmull-Rom through points -> cubic segments
  let d='';for(let i=0;i<pts.length-1;i++){const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;
    const lo=(a,b,v)=>Math.min(Math.max(a,b),Math.max(Math.min(a,b),v));
    const c1=[lo(p1[0],p2[0],p1[0]+(p2[0]-p0[0])/6),lo(p1[1],p2[1],p1[1]+(p2[1]-p0[1])/6)],c2=[lo(p1[0],p2[0],p2[0]-(p3[0]-p1[0])/6),lo(p1[1],p2[1],p2[1]-(p3[1]-p1[1])/6)];
    d+=`C${c1[0].toFixed(1)} ${c1[1].toFixed(1)} ${c2[0].toFixed(1)} ${c2[1].toFixed(1)} ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`;}
  return d;
}
function grad(id,stops,x1,x2){return `<linearGradient id="${id}" x1="${x1||0}" x2="${x2||1}" y1="0" y2="0">${stops.map((c,i)=>`<stop offset="${(i/(stops.length-1)).toFixed(2)}" stop-color="${c}"/>`).join('')}</linearGradient>`}
function symbol(P,i){
  const w=P.w,cx=w/2,pr=P.prof,id='p'+i;
  const left=pr.map(([y,h])=>[cx-h,y]),right=pr.slice().reverse().map(([y,h])=>[cx+h,y]);
  const body=`M${left[0][0]} ${left[0][1]}`+smooth(left)+`L${right[0][0]} ${right[0][1]}`+smooth(right)+'Z';
  const L=P.label,C=P.cap,bw=pr.reduce((m,[,h])=>Math.max(m,h),0);
  let s=`<symbol id="${id}" viewBox="0 0 ${w} ${H0}">`;
  s+=`<defs>${grad(id+'g',P.glass)}${grad(id+'c',C.c)}${grad(id+'s',['rgba(0,0,0,.38)','rgba(0,0,0,0)','rgba(0,0,0,0)','rgba(0,0,0,.22)','rgba(0,0,0,.45)'])}
    <linearGradient id="${id}h" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".2" stop-color="#fff" stop-opacity=".8"/><stop offset=".85" stop-color="#fff" stop-opacity=".7"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <clipPath id="${id}k"><path d="${body}"/></clipPath></defs>`;
  s+=`<path d="${body}" fill="url(#${id}g)"/>`;
  s+=`<g clip-path="url(#${id}k)">`;
  s+=`<rect x="0" y="${H0-14}" width="${w}" height="14" fill="#fff" opacity=".22"/>`;
  s+=`<rect x="${cx-bw*0.72}" y="${pr[0][0]}" width="${bw*0.09}" height="${H0-pr[0][0]-20}" fill="url(#${id}h)" opacity=".75"/>`;
  s+=`<rect x="${cx-bw*0.52}" y="${pr[0][0]}" width="${bw*0.2}" height="${H0-pr[0][0]-20}" fill="url(#${id}h)" opacity=".16"/>`;
  s+=`<rect x="${cx+bw*0.7}" y="${pr[0][0]+20}" width="${bw*0.05}" height="${H0-pr[0][0]-50}" fill="url(#${id}h)" opacity=".5"/>`;
  /* label */
  const lw=bw*1.72,lx=cx-lw/2,lh=L.y1-L.y0;
  s+=`<rect x="${lx}" y="${L.y0}" width="${lw}" height="${lh}" fill="${L.bg}"/>`;
  s+=`<rect x="${lx+6}" y="${L.y0+6}" width="${lw-12}" height="${lh-12}" fill="none" stroke="${L.acc}" stroke-width="1"/>`;
  s+=`<text x="${cx}" y="${L.y0+lh*0.3}" text-anchor="middle" font-family="Inter,sans-serif" font-weight="600" font-size="${Math.min(11,lw*0.1)}" letter-spacing="2.2" fill="${L.ink}">${L.t1}</text>`;
  if(L.t2)s+=`<text x="${cx}" y="${L.y0+lh*0.62}" text-anchor="middle" font-family="Georgia,'Noto Serif SC',serif" font-style="italic" font-size="${Math.min(30,lw*0.24)}" fill="${L.ink}">${L.t2}</text>`;
  s+=`<rect x="${cx-lw*0.22}" y="${L.y0+lh*0.72}" width="${lw*0.44}" height="1" fill="${L.acc}"/>`;
  s+=`<text x="${cx}" y="${L.y0+lh*0.86}" text-anchor="middle" font-family="Inter,sans-serif" font-weight="500" font-size="${Math.min(8,lw*0.07)}" letter-spacing="1.6" fill="${L.acc}">${L.t3}</text>`;
  s+=`<rect x="${lx}" y="${L.y0}" width="${lw}" height="${lh}" fill="url(#${id}s)"/>`;
  s+=`</g>`;
  s+=`<path d="${body}" fill="none" stroke="rgba(0,0,0,.25)" stroke-width="1"/>`;
  /* closure */
  if(C.neck)s+=`<rect x="${cx-C.neck.hw}" y="${C.neck.y0}" width="${C.neck.hw*2}" height="${C.neck.y1-C.neck.y0}" fill="url(#${id}g)" opacity=".9"/>`;
  if(C.dropper){
    s+=`<path d="M${cx-18} ${C.y0+92}C${cx-26} ${C.y0+40} ${cx-22} ${C.y0} ${cx} ${C.y0}C${cx+22} ${C.y0} ${cx+26} ${C.y0+40} ${cx+18} ${C.y0+92}Z" fill="url(#${id}c)"/>`;
    s+=`<rect x="${cx-C.hw}" y="${C.y0+92}" width="${C.hw*2}" height="${C.y1-C.y0-92}" rx="4" fill="url(#${id}c)"/>`;
    s+=`<rect x="${cx-C.hw}" y="${C.y0+92}" width="${C.hw*2}" height="6" fill="${C.ring}"/>`;
  }else{
    s+=`<rect x="${cx-C.hw}" y="${C.y0}" width="${C.hw*2}" height="${C.y1-C.y0}" rx="${Math.min(8,C.hw*0.3)}" fill="url(#${id}c)"/>`;
    for(let k=1;k<7;k++)s+=`<rect x="${cx-C.hw+k*C.hw*2/7}" y="${C.y0+4}" width="1" height="${C.y1-C.y0-8}" fill="#000" opacity=".1"/>`;
    s+=`<rect x="${cx-C.hw-1}" y="${C.y1-6}" width="${C.hw*2+2}" height="6" fill="${C.ring}"/>`;
  }
  s+=`</symbol>`;return s;
}
document.getElementById('defs').innerHTML=PRODUCTS.map(symbol).join('');
const NS='http://www.w3.org/2000/svg';
function useSvg(i){const P=PRODUCTS[i],s=document.createElementNS(NS,'svg');s.setAttribute('viewBox',`0 0 ${P.w} ${H0}`);s.setAttribute('aria-hidden','true');
  const u=document.createElementNS(NS,'use');u.setAttribute('href','#p'+i);u.setAttribute('width',P.w);u.setAttribute('height',H0);s.append(u);return s}
/* two deliverables per product: a 4:5 key visual and a 9:16 story frame */
const BG=[['#f3e4d2','#e8cdb2'],['#f8e3e1','#efcfcb'],['#e6ede2','#d3dfcd'],['#e3edf6','#cddcec'],['#f5ecdc','#e9dcc4'],['#e4eeec','#cfe0dd']];
function frameSvg(i,story){
  const P=PRODUCTS[i],fw=story?360:400,fh=story?640:500,s=document.createElementNS(NS,'svg');
  s.setAttribute('viewBox',`0 0 ${fw} ${fh}`);s.setAttribute('aria-hidden','true');s.setAttribute('preserveAspectRatio','xMidYMid meet');
  const ph=fh*(story?0.62:0.74),pw=ph*P.w/H0,px=(fw-pw)/2,py=fh*(story?0.24:0.16);
  s.innerHTML=`<defs><linearGradient id="bg${i}${story?'s':'k'}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${BG[i][0]}"/><stop offset="1" stop-color="${BG[i][1]}"/></linearGradient></defs>
    <rect width="${fw}" height="${fh}" rx="6" fill="url(#bg${i}${story?'s':'k'})"/>
    <ellipse cx="${fw/2}" cy="${py+ph}" rx="${pw*0.62}" ry="${ph*0.03}" fill="rgba(60,50,40,.22)"/>
    <use href="#p${i}" x="${px}" y="${py}" width="${pw}" height="${ph}"/>
    ${story?`<text x="${fw/2}" y="${fh*0.13}" text-anchor="middle" font-family="Michroma,sans-serif" font-size="20" letter-spacing="4" fill="#16191f">NEW</text><rect x="${fw/2-60}" y="${fh*0.92}" width="120" height="30" rx="15" fill="#16191f"/><text x="${fw/2}" y="${fh*0.92+20}" text-anchor="middle" font-family="Inter,sans-serif" font-size="12" fill="#fff">Shop now</text>`:''}`;
  return s;
}
const ITEMS=[];PRODUCTS.forEach((P,i)=>{ITEMS.push([i,0,P.name+' Key Visual','4:5 · Hero still']);ITEMS.push([i,1,P.name+' Story','9:16 · Social cut'])});

/* ---------- runway depth engine ---------- */
const KX=[1.2,.744,.496,.346,.235,.15,.085],KF=[1.14,.89,.777,.704,.651,.616,.59],KH=[1.18,.832,.574,.436,.334,.258,.19],
      KB=[0,0,1.5,4,8,12,17],KO=[1,1,1,1,.86,.5,0];
const N=PRODUCTS.length,$=id=>document.getElementById(id),calm=matchMedia('(prefers-reduced-motion:reduce)').matches;
const stage=$('stage'),rail=$('rail'),ring=$('ring'),roll=$('roll'),line=$('line'),pname=$('pname');
const wrap=(x,n)=>((x%n)+n)%n,clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const people=PRODUCTS.map((P,i)=>{const e=document.createElement('div');e.className='m';e.dataset.i=i;e.append(useSvg(i));line.append(e);return{e,r:P.w/H0,f:'',o:''}});
const cards=ITEMS.map(([pi,story,name,spec],i)=>{
  const e=document.createElement('article');e.className='card'+(i%2?' alt':'');
  e.innerHTML=`<button class="fav" aria-pressed="false" aria-label="Save ${name}"><svg viewBox="0 0 24 24"><path d="M12 20S3.5 15 3.5 9A4.6 4.6 0 0 1 12 6.6 4.6 4.6 0 0 1 20.5 9C20.5 15 12 20 12 20Z"/></svg></button><span class="shot"></span><div class="meta"><h3 class="wide">${name}</h3><span>${spec}</span><button class="add" aria-label="Add ${name} to brief"></button></div>`;
  e.querySelector('.shot').append(frameSvg(pi,story));rail.append(e);return e;
});
for(let i=0;i<=N;i++){const b=document.createElement('b');b.textContent=String(1+i%N).padStart(2,'0');roll.append(b)}
const toastEl=$('toast');let tt;function toast(m){toastEl.textContent=m;toastEl.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>toastEl.classList.remove('show'),2400)}
document.querySelectorAll('[data-contact]').forEach(b=>b.addEventListener('click',e=>{e.preventDefault();toast('联系方式待补充：WhatsApp · 微信 · Email')}));
let cart=0;
rail.addEventListener('click',e=>{
  const f=e.target.closest('.fav');if(f)f.setAttribute('aria-pressed',f.getAttribute('aria-pressed')!=='true');
  if(e.target.closest('.add')){$('cart').textContent=++cart;toast('已加入需求清单 · Added to your brief')}
});

let W=0,H=0,base=0,cardS=0,side=false,dirty=true,p=0,target=0,last=0,shown=-1;
function size(){
  W=stage.clientWidth;H=stage.clientHeight;base=H*1.2;side=innerWidth<=820;
  people.forEach(m=>{m.e.style.width=base*m.r+'px';m.e.style.height=base+'px'});
  cardS=side?160:rail.clientHeight/3;
  cards.forEach(c=>c.style.height=side?'100%':cardS+'px');
  dirty=true;
}
addEventListener('resize',size);
function paint(){
  people.forEach((m,i)=>{
    let d=wrap(i-p,N);if(d>N-1)d-=N;
    const k=clamp(d+1,0,6),a=Math.floor(k),b=Math.min(6,a+1),t=k-a,mix=A=>A[a]+(A[b]-A[a])*t;
    const h=mix(KH)*H,s=h/base,w=h*m.r,x=mix(KX)*W-w/2,y=mix(KF)*H-h;
    m.e.style.transform=`translate3d(${x.toFixed(1)}px,${y.toFixed(1)}px,0) scale(${s.toFixed(4)})`;
    const f=mix(KB)/s,fs=f<.2?'none':`blur(${f.toFixed(1)}px)`,o=mix(KO).toFixed(3);
    if(fs!==m.f){m.f=fs;m.e.style.filter=fs}
    if(o!==m.o){m.o=o;m.e.style.opacity=o}
    m.e.style.zIndex=100-Math.round(d*10);
  });
  const all=cardS*ITEMS.length;
  cards.forEach((c,i)=>{
    let y=wrap(i*cardS-p*2*cardS,all);if(y>all-cardS)y-=all;
    c.style.transform=side?`translate3d(${y.toFixed(1)}px,0,0)`:`translate3d(0,${y.toFixed(1)}px,0)`;
  });
  roll.style.transform=`translate3d(0,${(-wrap(p,N)*roll.firstChild.offsetHeight).toFixed(1)}px,0)`;
  const cur=Math.round(wrap(p,N))%N;if(cur!==shown){shown=cur;pname.textContent=PRODUCTS[cur].name+' · '+PRODUCTS[cur].kind}
}
let mx=0,my=0,cx=0,cy=0,down=false,sx=0,st=0,moved=0,wheelT=0;
function frame(now){
  const dt=Math.min(50,now-last)||16;last=now;
  const was=p;
  if(calm)p=target;else p+=(target-p)*(1-Math.exp(-dt*.0072));
  if(Math.abs(target-p)<.0004)p=target;
  if(p!==was||dirty){dirty=false;paint()}
  cx+=(mx-cx)*.32;cy+=(my-cy)*.32;
  ring.style.transform=`translate3d(${cx.toFixed(1)}px,${cy.toFixed(1)}px,0)`;
}
const PULL=()=>Math.max(150,W*.2);
stage.addEventListener('pointerenter',e=>{if(e.pointerType==='mouse')ring.classList.add('show')});
stage.addEventListener('pointerleave',()=>ring.classList.remove('show'));
stage.addEventListener('pointermove',e=>{
  const r=stage.getBoundingClientRect();mx=e.clientX-r.left;my=e.clientY-r.top;
  if(!down)return;
  const dx=e.clientX-sx;moved=Math.max(moved,Math.abs(dx));target=st+dx/PULL();
});
stage.addEventListener('pointerdown',e=>{
  if(e.target.closest('a'))return;
  down=true;sx=e.clientX;st=target;moved=0;stage.setPointerCapture(e.pointerId);ring.classList.add('drag');
});
function release(e){
  if(!down)return;down=false;ring.classList.remove('drag');
  if(moved<6){
    const hit=document.elementsFromPoint(e.clientX,e.clientY).find(x=>x.classList&&x.classList.contains('m'));
    if(hit){let d=wrap(+hit.dataset.i-target,N);d=Math.round(d);if(d>0&&d<N)target=Math.round(target)+d}
  }else target=Math.round(target);
}
stage.addEventListener('pointerup',release);stage.addEventListener('pointercancel',release);
stage.addEventListener('wheel',e=>{
  e.preventDefault();target+=clamp(e.deltaY+e.deltaX,-120,120)/420;
  clearTimeout(wheelT);wheelT=setTimeout(()=>{target=Math.round(target)},150);
},{passive:false});
addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown'].includes(e.key)){e.preventDefault();target=Math.round(target)+1}
  if(['ArrowLeft','ArrowUp'].includes(e.key)){e.preventDefault();target=Math.round(target)-1}
});
function loop(t){frame(t);requestAnimationFrame(loop)}
(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(()=>{size();paint();$('wait').classList.add('gone')});
setTimeout(()=>$('wait').classList.add('gone'),2500);
size();requestAnimationFrame(loop);
</script>
</body>
</html>
