<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alpha Visual Say Hey</title>
<meta name="description" content="Fresh ideas, imagination and creative collaboration. A studio footer whose fuzzy mascot watches your cursor.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400&family=Epilogue:wght@900&family=Yellowtail&display=swap" rel="stylesheet">
<style>
/* Layout: one footer. Left info column, centred script logo, right contact column with three icons, over a full-bleed scene where a fuzzy mascot drawn in code follows the cursor with its eyes. On phones the content stacks and the scene sits below it. Single light look by design. */
:root{color-scheme:light;--background:#dfe4f2;--foreground:#080909;font-family:'DM Sans',Arial,sans-serif;font-weight:400;color:var(--foreground);background:var(--background);font-synthesis:none}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--background)}
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible{outline:2px solid currentColor;outline-offset:6px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.footer{position:relative;min-height:100vh;padding-top:6.54vw}
.jobs{margin-left:8.65vw;width:25vw}
.tag{display:inline-flex;align-items:center;border-radius:100px;background:#f7f8fa;padding:.39vw .61vw;font-size:.88vw;line-height:1.2;height:1.9vw;white-space:nowrap}
.headline{font-family:Epilogue,Arial,sans-serif;font-weight:900;font-size:1.66vw;line-height:1.2;letter-spacing:0}
.job-title{display:block;margin-top:1.45vw}
.footer-nav{display:flex;flex-direction:column;align-items:flex-start;gap:.93vw;margin-top:1.3vw;font-size:1.075vw;line-height:1.35}
.footer-nav a:hover{text-decoration:underline;text-underline-offset:3px}
.logo{position:absolute;left:40.33vw;top:7.7vw;width:17vw;display:block}
.logo svg{display:block;width:100%;height:auto}
.contact{position:absolute;left:74.3vw;top:6.54vw}
.contact-links{display:flex;flex-direction:column;align-items:flex-start;margin-top:1.45vw;white-space:nowrap}
.note{margin:1.05vw 0 0;font-size:.733vw;line-height:1.4;white-space:nowrap}
.socials{display:flex;align-items:center;gap:1.43vw;margin-top:1.61vw}
.socials button,.socials svg{display:block;width:1.71vw;height:1.71vw}
.socials svg{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.footer{isolation:isolate;overflow:hidden}
.footer-background{position:absolute;inset:0;z-index:-1;pointer-events:none}
.footer-background canvas{position:absolute;inset:0;display:block;width:100%;height:100%}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,10px);z-index:9;max-width:calc(100vw - 32px);padding:10px 16px;border-radius:999px;background:#080909;color:#fff;font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:700px){
  :root{--background:#f0eefa;background:var(--background)}
  body{background:var(--background)}
  .footer{display:flex;flex-direction:column;gap:36px;min-height:100svh;padding:40px 24px 0;background:var(--background)}
  .logo{position:static;order:0;align-self:flex-start;width:210px;max-width:75%;margin-bottom:4px}
  .jobs{order:1;margin:0;width:100%}
  .tag{height:30px;padding:6px 11px;font-size:14px}
  .headline{font-size:clamp(22px,6.3vw,30px);line-height:1.25}
  .job-title,.contact-links{margin-top:19px}
  .footer-nav{display:grid;grid-template-columns:1fr 1fr;gap:0 24px;margin-top:20px;font-size:17px;line-height:1.4}
  .footer-nav a{display:flex;align-items:center;min-height:44px}
  .contact{position:static;order:2;width:100%}
  .contact-links{gap:4px;white-space:normal}
  .note{max-width:34ch;margin:16px 0 0;font-size:14px;line-height:1.5;white-space:normal}
  .socials{gap:18px;margin-top:20px}
  .socials button{display:flex;align-items:center;justify-content:center;width:44px;height:44px}
  .socials svg{width:30px;height:30px}
  .socials button:first-child{margin-left:-7px}
  .footer-background{position:relative;inset:auto;order:3;z-index:auto;flex:none;align-self:center;width:calc(100% + 48px);aspect-ratio:4/3;margin-top:-16px}
}
</style>
</head>
<body>
<footer class="footer" aria-label="Footer">
  <div class="footer-background" aria-hidden="true"><canvas id="scene"></canvas></div>
  <div class="jobs">
    <span class="tag">have a fresh idea?</span>
    <span class="headline job-title">imagination<br>meets craft</span>
    <nav class="footer-nav" aria-label="Studio">
      <a href="/">Made</a>
      <a href="/work/editorial/">Story</a>
      <a href="/work/lab/">In the lab</a>
      <a href="#" data-contact>Say hey</a>
    </nav>
  </div>
  <a class="logo" href="/" aria-label="Alpha Visual, all work">
    <svg viewBox="0 0 169 40" aria-hidden="true"><text x="2" y="31" font-family="Yellowtail,cursive" font-size="37" textLength="164" lengthAdjust="spacingAndGlyphs" fill="currentColor">alpha visual</text></svg>
  </a>
  <div class="contact">
    <span class="tag">say hey</span>
    <div class="headline contact-links">
      <span>let’s team up!</span>
      <span>bring us your idea*</span>
    </div>
    <p class="note">*good things start with one spark. let’s make yours.</p>
    <div class="socials">
      <button type="button" aria-label="LinkedIn" data-social><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="2.5" width="19" height="19" rx="4"/><path d="M7.5 10.5v6M7.5 7.4v.1M11 16.5v-6M11 13c0-1.6 1-2.6 2.4-2.6 1.4 0 2.1 1 2.1 2.6v3.5"/></svg></button>
      <button type="button" aria-label="Instagram" data-social><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="2.5" width="19" height="19" rx="5.5"/><circle cx="12" cy="12" r="4.2"/><path d="M17.4 6.6v.1"/></svg></button>
      <button type="button" aria-label="TikTok" data-social><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13.5 3v11.6a3.4 3.4 0 1 1-3.4-3.4"/><path d="M13.5 3c.4 2.6 2.2 4.4 4.9 4.6"/></svg></button>
    </div>
  </div>
</footer>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(function () {
  var toastEl = document.getElementById('toast'), tt;
  function toast(m) { toastEl.textContent = m; toastEl.classList.add('show'); clearTimeout(tt); tt = setTimeout(function () { toastEl.classList.remove('show'); }, 2400); }
  document.querySelectorAll('[data-contact]').forEach(function (b) { b.addEventListener('click', function (e) { e.preventDefault(); toast('联系方式待补充：WhatsApp · 微信 · Email'); }); });
  document.querySelectorAll('[data-social]').forEach(function (b) { b.addEventListener('click', function () { toast('社交账号待补充'); }); });

  /* ---------- the mascot: drawn once into a fur layer, eyes drawn every frame ---------- */
  var c = document.getElementById('scene'), g = c.getContext('2d');
  var mobile = matchMedia('(max-width: 700px)'), reduce = matchMedia('(prefers-reduced-motion: reduce)');
  var W, H, DPR, S, OX, OY, fur = document.createElement('canvas');
  var EYE = { x: 948, y: 418 }; /* midpoint between the eyes, in the 1920 x 1080 design frame */
  function seeded(n) { return function () { n = (n * 16807) % 2147483647; return (n - 1) / 2147483646; }; }
  function bodyR(a) { return 1 + 0.035 * Math.sin(a * 3 + 0.6) + 0.025 * Math.sin(a * 5 + 1.9); }
  function paintFur() {
    fur.width = c.width; fur.height = c.height;
    var k = fur.getContext('2d'), r = seeded(19);
    k.setTransform(DPR * S, 0, 0, DPR * S, DPR * OX, DPR * OY);
    var bg = k.createLinearGradient(0, 0, 0, 1080); bg.addColorStop(0, '#f2f0fb'); bg.addColorStop(0.6, '#e8e9f6'); bg.addColorStop(1, '#dfe4f2');
    k.fillStyle = bg; k.fillRect(-2000, -2000, 6000, 6000);
    var floor = k.createRadialGradient(960, 1090, 10, 960, 1090, 560); floor.addColorStop(0, 'rgba(120,110,170,.28)'); floor.addColorStop(1, 'rgba(120,110,170,0)');
    k.fillStyle = floor; k.fillRect(300, 800, 1320, 400);
    var cx = 960, cy = 720, rx = 340, ry = 430;
    function inside(px, py, grow) { var a = Math.atan2(py - cy, px - cx), d = Math.hypot((px - cx) / rx, (py - cy) / ry); return d < bodyR(a) * (grow || 1); }
    var base = k.createRadialGradient(cx - 90, cy - 220, 40, cx, cy, 520); base.addColorStop(0, '#d9d0f6'); base.addColorStop(0.55, '#b7a9e6'); base.addColorStop(1, '#8f80c9');
    k.beginPath(); for (var i = 0; i <= 120; i++) { var a = i / 120 * Math.PI * 2, rr = bodyR(a); k.lineTo(cx + Math.cos(a) * rx * rr, cy + Math.sin(a) * ry * rr); } k.closePath(); k.fillStyle = base; k.fill();
    k.lineCap = 'round';
    var pal = ['#e9e2fb', '#cbbff1', '#b2a3e3', '#9d8dd6', '#f4effd'];
    function strand(x, y, ang, len, col, w, al) { k.strokeStyle = col; k.globalAlpha = al; k.lineWidth = w; k.beginPath(); k.moveTo(x, y); k.quadraticCurveTo(x + Math.cos(ang + 0.4) * len * 0.5, y + Math.sin(ang + 0.4) * len * 0.5, x + Math.cos(ang) * len, y + Math.sin(ang) * len); k.stroke(); }
    for (var n = 0; n < 16000; n++) {
      var a2 = r() * Math.PI * 2, d = Math.sqrt(r()) * 1.02, px = cx + Math.cos(a2) * rx * d * bodyR(a2), py = cy + Math.sin(a2) * ry * d * bodyR(a2);
      var out = Math.atan2((py - cy) / ry, (px - cx) / rx) + (r() - 0.5) * 1.2, edge = d > 0.85;
      var lit = 1 - (py - (cy - ry)) / (ry * 2), col = pal[Math.min(4, Math.max(0, Math.floor((lit + (r() - 0.5) * 0.6) * 4.6)))];
      strand(px, py, out + (edge ? 0 : Math.PI * 0.5 * (r() - 0.5)), (edge ? 18 : 12) + r() * 16, col, 2 + r() * 2.2, edge ? 0.75 : 0.5);
    }
    /* tufts on the head */
    [[-0.32, 70], [-0.05, 92], [0.25, 64]].forEach(function (t) { for (var m = 0; m < 70; m++) strand(cx + t[0] * rx + (r() - 0.5) * 40, cy - ry * 0.97 + r() * 20, -Math.PI / 2 + (r() - 0.5) * 0.9 + t[0], t[1] * (0.6 + r() * 0.5), pal[(r() * 3) | 0], 2.4, 0.8); });
    k.globalAlpha = 1;
    var shade = k.createLinearGradient(cx - rx, 0, cx + rx, 0); shade.addColorStop(0, 'rgba(70,55,130,.22)'); shade.addColorStop(0.35, 'rgba(70,55,130,0)'); shade.addColorStop(0.7, 'rgba(70,55,130,0)'); shade.addColorStop(1, 'rgba(70,55,130,.28)');
    k.save(); k.beginPath(); for (var i2 = 0; i2 <= 120; i2++) { var a4 = i2 / 120 * Math.PI * 2, r4 = bodyR(a4) * 1.04; k.lineTo(cx + Math.cos(a4) * rx * r4, cy + Math.sin(a4) * ry * r4); } k.closePath(); k.clip(); k.fillStyle = shade; k.fillRect(cx - rx * 1.1, cy - ry * 1.1, rx * 2.2, ry * 2.2); k.restore();
    /* arms holding a little pink camera */
    function arm(sx, sy, ex, ey) { for (var q = 0; q < 900; q++) { var t = r(), x = sx + (ex - sx) * t + (r() - 0.5) * 64, y = sy + (ey - sy) * t + (r() - 0.5) * 64, ang = Math.atan2(ey - sy, ex - sx) + (r() - 0.5) * 2.4; strand(x, y, ang, 10 + r() * 14, pal[1 + ((r() * 3) | 0)], 2.4, 0.7); } }
    arm(700, 640, 840, 760); arm(1220, 640, 1080, 760);
    k.globalAlpha = 1;
    k.save(); k.translate(960, 770); k.rotate(-0.04);
    k.fillStyle = 'rgba(80,60,120,.25)'; k.beginPath(); k.ellipse(6, 92, 150, 22, 0, 0, Math.PI * 2); k.fill();
    var cam = k.createLinearGradient(0, -80, 0, 90); cam.addColorStop(0, '#ffc7d8'); cam.addColorStop(1, '#f590b1');
    k.fillStyle = cam; k.beginPath(); k.roundRect ? k.roundRect(-140, -78, 280, 168, 34) : k.rect(-140, -78, 280, 168); k.fill();
    k.fillStyle = '#ffe3ec'; k.fillRect(-140, -78, 280, 42);
    k.fillStyle = '#3b2f5a'; k.beginPath(); k.arc(0, 18, 58, 0, Math.PI * 2); k.fill();
    var lens = k.createRadialGradient(-16, 2, 4, 0, 18, 46); lens.addColorStop(0, '#9fb6ff'); lens.addColorStop(0.5, '#2a2f5c'); lens.addColorStop(1, '#141329');
    k.fillStyle = lens; k.beginPath(); k.arc(0, 18, 44, 0, Math.PI * 2); k.fill();
    k.fillStyle = 'rgba(255,255,255,.75)'; k.beginPath(); k.arc(-16, 2, 10, 0, Math.PI * 2); k.fill();
    k.fillStyle = '#fff6c2'; k.fillRect(78, -62, 38, 22);
    k.fillStyle = '#3b2f5a'; k.beginPath(); k.arc(-96, -56, 9, 0, Math.PI * 2); k.fill();
    k.restore();
    /* paws over the camera edges */
    [[835, 760], [1085, 760]].forEach(function (p) { for (var q = 0; q < 260; q++) { var a3 = r() * Math.PI * 2, d3 = Math.sqrt(r()) * 46; strand(p[0] + Math.cos(a3) * d3, p[1] + Math.sin(a3) * d3, a3, 8 + r() * 10, pal[(r() * 3) | 0], 2.2, 0.85); } });
    k.globalAlpha = 1;
    /* mouth */
    k.strokeStyle = '#3b2f5a'; k.lineWidth = 6; k.beginPath(); k.moveTo(912, 500); k.quadraticCurveTo(948, 530, 984, 500); k.stroke();
    k.fillStyle = '#fff'; k.beginPath(); k.moveTo(930, 509); k.lineTo(938, 524); k.lineTo(946, 512); k.fill();
    k.fillStyle = 'rgba(255,150,180,.35)'; k.beginPath(); k.ellipse(842, 478, 30, 16, 0, 0, Math.PI * 2); k.ellipse(1054, 478, 30, 16, 0, 0, Math.PI * 2); k.fill();
  }
  function resize() {
    var rect = c.getBoundingClientRect(); W = Math.max(1, rect.width); H = Math.max(1, rect.height); DPR = Math.min(2, window.devicePixelRatio || 1);
    c.width = Math.round(W * DPR); c.height = Math.round(H * DPR);
    S = Math.max(W / 1920, H / 1080); OX = (W - 1920 * S) / 2; OY = (H - 1080 * S) / 2;
    paintFur(); dirty = true;
  }
  /* gaze: the pupils point from the eye midpoint toward the pointer */
  var gaze = { x: 0, y: 0 }, want = { x: 0, y: 0 }, pointer = null, blink = 0, nextBlink = 4, dirty = true, t0 = performance.now();
  function eyeScreen() { var rect = c.getBoundingClientRect(); return { x: rect.left + OX + EYE.x * S, y: rect.top + OY + EYE.y * S }; }
  function aim() {
    if (!pointer || mobile.matches) return;
    var e = eyeScreen(), dx = pointer.x - e.x, dy = pointer.y - e.y, dist = Math.hypot(dx, dy);
    if (dist < 8) return;
    var reach = Math.min(1, dist / 260); want.x = dx / dist * reach; want.y = dy / dist * reach;
  }
  addEventListener('pointermove', function (e) { pointer = { x: e.clientX, y: e.clientY }; aim(); }, { passive: true });
  addEventListener('scroll', aim, { passive: true });
  function drawEyes(now) {
    g.setTransform(DPR, 0, 0, DPR, 0, 0); g.drawImage(fur, 0, 0, W, H);
    g.setTransform(DPR * S, 0, 0, DPR * S, DPR * OX, DPR * OY);
    var lid = blink > 0 ? Math.sin(Math.min(1, blink) * Math.PI) : 0;
    [[898, 418], [1000, 418]].forEach(function (p, i) {
      g.save(); g.translate(p[0], p[1]);
      g.fillStyle = 'rgba(70,50,120,.18)'; g.beginPath(); g.ellipse(0, 6, 50, 56, 0, 0, Math.PI * 2); g.fill();
      g.beginPath(); g.ellipse(0, 0, 46, 52 * (1 - lid * 0.95), 0, 0, Math.PI * 2); g.fillStyle = '#ffffff'; g.fill();
      g.clip();
      var px = gaze.x * 20, py = gaze.y * 22;
      g.fillStyle = '#1d1730'; g.beginPath(); g.arc(px, py, 23, 0, Math.PI * 2); g.fill();
      g.fillStyle = '#4b3f86'; g.beginPath(); g.arc(px, py, 12, 0, Math.PI * 2); g.fill();
      g.fillStyle = '#ffffff'; g.beginPath(); g.arc(px - 8, py - 9, 6.5, 0, Math.PI * 2); g.fill();
      g.restore();
      g.strokeStyle = '#3b2f5a'; g.lineWidth = 3; g.beginPath(); g.ellipse(p[0], p[1], 46, 52 * (1 - lid * 0.95), 0, 0, Math.PI * 2); g.stroke();
    });
  }
  function frame(now) {
    var t = (now - t0) / 1000;
    if (mobile.matches) { if (!reduce.matches) { want.x = Math.cos(t * 1.6) * 0.85; want.y = Math.sin(t * 1.6) * 0.85; } }
    var px = gaze.x, py = gaze.y; gaze.x += (want.x - gaze.x) * 0.18; gaze.y += (want.y - gaze.y) * 0.18;
    if (!reduce.matches) { if (t > nextBlink) { blink += 0.12; if (blink >= 1) { blink = 0; nextBlink = t + 2.5 + Math.random() * 3; } } }
    if (dirty || blink > 0 || Math.abs(px - gaze.x) + Math.abs(py - gaze.y) > 0.0005) { dirty = false; drawEyes(now); }
    requestAnimationFrame(frame);
  }
  addEventListener('resize', function () { resize(); aim(); });
  mobile.addEventListener ? mobile.addEventListener('change', function () { resize(); }) : 0;
  resize();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { dirty = true; });
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
